                          style={{flex:1,padding:"11px",borderRadius:12,border:"1px solid",cursor:"pointer",fontSize:14,fontWeight:600,fontFamily:"inherit",
                            borderColor:aktiv?(config.appAccentColor||"#a78bfa"):"rgba(255,255,255,0.12)",
                            background:aktiv?`${(config.appAccentColor||"#a78bfa")}22`:"rgba(255,255,255,0.04)",
                            color:aktiv?(config.appAccentColor||"#a78bfa"):"var(--label-textfarbe, #6b7280)"}}>
                          {opt==="Ja"?"✅ Ja":"❌ Nein"}
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>
            ))}

            </>) }

            {(config.erfassenFelder?.notiz !== false) && (
            <div style={{marginBottom:20}}>
              <div style={{fontSize:11,color:"#a78bfa",letterSpacing:2,marginBottom:6,textTransform:"uppercase"}}>{t("tagesnotiz")}</div>
              <textarea rows={4} value={eintrag.notiz||""} placeholder={t("notiz_placeholder")}
                onChange={e=>updateEintrag("notiz",e.target.value)}
                style={{...inp,width:"100%",resize:"vertical",lineHeight:1.6,fontSize:14}} />
            </div>
            )}

            {tagesErgebnis && (()=>{
              const regelAZ = Number(config.regelarbeitszeit) || 7.6;
              const grenzeWoche = Number(config.ueberstundenGrenzeWoche) || 40.0;
              const grenzeTag = grenzeWoche / 5; // z.B. 40h/Woche -> 8h/Tag

              // "Heute" wird bewusst NUR aus den heutigen Stunden berechnet –
              // KEINE Wochenverrechnung mehr, damit "heute" nicht fälschlich
              // Mehrarbeit/Überstunden aus anderen Tagen zugeschrieben bekommt.
              // Stunden zwischen Regelarbeitszeit und Tagesgrenze = Mehrarbeit
              // (kein Zuschlag), alles über der Tagesgrenze = Zuschlag.
              const heuteNormal = Math.min(tagesErgebnis.gesamtStunden, regelAZ);
              const heuteMehr   = Math.max(0, Math.min(tagesErgebnis.gesamtStunden, grenzeTag) - regelAZ);
              const heuteUeber  = Math.max(0, tagesErgebnis.gesamtStunden - grenzeTag);
              const heuteBng    = Math.max(0, regelAZ - tagesErgebnis.gesamtStunden);
              const ueberAnzeige = heuteMehr + heuteUeber;

              const normalLohnAnz = heuteNormal * tagesSlohn;
              const mehrLohnAnz    = heuteMehr   * tagesSlohn;
              const ueberLohnAnz   = heuteUeber  * tagesSlohn * (1 + Number(config.ueberstundenZuschlag)/100);
              const gesamtLohnAnz  = normalLohnAnz + mehrLohnAnz + ueberLohnAnz + (tagesErgebnis.nachtLohn||0);

              return (
              <div style={{background:"rgba(167,139,250,0.1)",border:"1px solid rgba(167,139,250,0.3)",borderRadius:16,padding:20}}>
                <div style={{fontSize:11,letterSpacing:3,color:"#a78bfa",marginBottom:14,textTransform:"uppercase"}}>{t("tagesergebnis")}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                  <Stat label={t("arbeitszeit")}      value={formatZeit(tagesErgebnis.gesamtMin, config.dezimalformat)} />
                  <Stat label={t("ueberstunden")}      value={formatZeit(Math.round(ueberAnzeige*60), config.dezimalformat)} accent={ueberAnzeige>0} />
                  {heuteMehr>0 && (
                    <div style={{gridColumn:"1 / -1",fontSize:11,color:"var(--label-textfarbe, #6b7280)",marginTop:-6}}>
                      davon Mehrarbeit (kein Zuschlag): {formatZeit(Math.round(heuteMehr*60), config.dezimalformat)} · {t("davon_mit_zuschlag")}: {formatZeit(Math.round(heuteUeber*60), config.dezimalformat)}
                    </div>
                  )}
                  {heuteBng>0 && ueberstundenMethode==="woechentlich" && tagesErgebnis.gesamtStunden>0 && (
                    <div style={{gridColumn:"1 / -1",fontSize:11,color:"#fb923c",marginTop:-6}}>
                      ⚠️ BNG (bezahlt nicht gearbeitet): {formatZeit(Math.round(heuteBng*60), config.dezimalformat)} – wird ggf. aus dem Mehrarbeit-Topf der Woche aufgefüllt
                    </div>
                  )}
                  <Stat label={t("normallohn")}        value={`€ ${normalLohnAnz.toFixed(2)}`} />
                  <Stat label={t("ueberstundenzuschl")} value={`€ ${ueberLohnAnz.toFixed(2)}`} accent={ueberAnzeige>0} />
                  {tagesErgebnis.nachtLohn>0 && <Stat label={`🌙 ${t("nachtzulage").replace("🌙 ","")} ${Number(config.nachtschichtzulage)||25}% (${tagesErgebnis.nachtStunden.toFixed(2)}h)`} value={`€ ${tagesErgebnis.nachtLohn.toFixed(2)}`} accent />}
                </div>
                <div style={{marginTop:16,paddingTop:14,borderTop:"1px solid rgba(167,139,250,0.2)",display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                  <span style={{fontSize:13,color:"#a78bfa"}}>{t("gesamt_brutto")}</span>
                  <span style={{fontSize:26,fontWeight:700,color:"#c4b5fd"}}>€ {gesamtLohnAnz.toFixed(2)}</span>
                </div>
                {tagesErgebnis.gesamtStunden >= (config.spesenMindestStunden||8) ? (
                  <div style={{marginTop:10,display:"flex",justifyContent:"space-between",alignItems:"center",background:"rgba(52,211,153,0.1)",borderRadius:10,padding:"10px 14px",border:"1px solid rgba(52,211,153,0.3)"}}>
                    <span style={{fontSize:13,color:"#34d399"}}>🍽️ {t("spesen")}</span>
                    <span style={{fontSize:18,fontWeight:700,color:"#34d399"}}>+ € {Number(config.spesenBetrag).toFixed(2)}</span>
                  </div>
                ) : (
                  <div style={{marginTop:10,display:"flex",justifyContent:"space-between",alignItems:"center",background:"rgba(255,255,255,0.03)",borderRadius:10,padding:"10px 14px",border:"1px solid rgba(255,255,255,0.06)"}}>
                    <span style={{fontSize:12,color:"var(--label-textfarbe, #6b7280)"}}>🍽️ {t("spesen_ab")} {config.spesenMindestStunden||8}h)</span>
                    <span style={{fontSize:12,color:"var(--label-textfarbe, #6b7280)"}}>{t("noch")} {formatZeit(Math.round(((config.spesenMindestStunden||8) - tagesErgebnis.gesamtStunden)*60), config.dezimalformat)}</span>
                  </div>
                )}
              </div>
              );
            })()}
          </div>
        )}

        {/* ── MONAT ── */}
        {view==="monat" && (
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
              <button onClick={()=>setSelectedMonth(prev=>{const d=new Date(prev.year,prev.month-1);return{year:d.getFullYear(),month:d.getMonth()};})} style={navBtn}>‹</button>
              <span style={{fontWeight:700,fontSize:18}}>{MONTHS[month]} {year}</span>
              <button onClick={()=>setSelectedMonth(prev=>{const d=new Date(prev.year,prev.month+1);return{year:d.getFullYear(),month:d.getMonth()};})} style={navBtn}>›</button>
            </div>

            <div style={{background:"rgba(167,139,250,0.1)",border:"1px solid rgba(167,139,250,0.3)",borderRadius:16,padding:20,marginBottom:20}}>
              <div style={{fontSize:11,letterSpacing:3,color:"#a78bfa",marginBottom:14,textTransform:"uppercase"}}>{t("monatsuebersicht")}</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <Stat label={t("gesamtstunden")} value={formatZeit(monatsGesamtMin, config.dezimalformat)} />
                <Stat label={t("ueberstunden")}   value={formatZeit(Math.round(monatsUeber), config.dezimalformat)} accent={monatsUeber>0} />
                {monatsUeber>0 && monatsUeberZuschlag<monatsUeber && (
                  <div style={{gridColumn:"1 / -1",fontSize:11,color:"var(--label-textfarbe, #6b7280)",marginTop:-6}}>
                    {t("davon_mit_zuschlag")}: {formatZeit(Math.round(monatsUeberZuschlag),config.dezimalformat)}
                  </div>
                )}
                {monatsNachtStunden>0 && <Stat label={t("nachtstunden")} value={formatZeit(Math.round(monatsNachtStunden*60), config.dezimalformat)} />}
                {monatsNachtLohn>0 && <Stat label={t("nachtzulage")} value={`€ ${monatsNachtLohn.toFixed(2)}`} />}
                <Stat label={t("bruttolohn")}    value={`€ ${monatsLohn.toFixed(2)}`} accent />
                {(config.erfassenFelder||{}).kilometer!==false && <Stat label={t("gefahrene_km")} value={`${monatsKm.toFixed(1)} km`} />}
                {(config.erfassenFelder||{}).startkilometer!==false && monatsGefahren>0 && <Stat label="🔢→🏁 Gefahren" value={`${monatsGefahren.toFixed(0)} km`} />}
                {(config.erfassenFelder||{}).kraftstoff!==false && <Stat label={t("kraftstoff")} value={`${monatsKraftstoff.toFixed(2)} L`} />}
                {(config.erfassenFelder||{}).kunden!==false && <Stat label={t("kunden_gesamt")} value={`${monatsKunden}`} />}
                {(config.erfassenFelder||{}).abholer!==false && <Stat label={t("abholer_gesamt")} value={`${monatsAbholer}`} />}
                {(config.erfassenFelder||{}).trinkgeld!==false && monatsTrinkgeld>0 && <Stat label={t("trinkgeld_gesamt")} value={`€ ${monatsTrinkgeld.toFixed(2)}`} accent />}
                {(config.erfassenFelder||{}).nachname!==false && monatsGeldeinnahmen>0 && <Stat label={t("nachname")} value={`€ ${monatsGeldeinnahmen.toFixed(2)}`} accent />}
                {(config.erfassenFelder||{}).patienten!==false && monatsPatienten>0 && <Stat label={t("patienten_gesamt")} value={`${monatsPatienten}`} />}
                {monatsSpesen>0 && <Stat label={t("spesen_gesamt")} value={`€ ${monatsSpesen.toFixed(2)}`} accent />}
                {monatsKleider>0 && <Stat label={t("kleiderreinigung")} value={`€ ${monatsKleider.toFixed(2)}`} />}
                {(config.eigeneFelder||[]).filter(f=>f.aktiv!==false&&f.typ==="zahl").map(feld=>{
                  const key=`_feld_${feld.id}`;
                  const summe=monatsTage.reduce((s,{e})=>s+(e&&e[key]?Number(e[key])||0:0),0);
                  if(summe===0) return null;
                  return <Stat key={feld.id} label={`${feld.icon||"📋"} ${feld.label}`} value={String(summe)} />;
                })}
                <Stat label={t("urlaubstage")} value={`${monatsUrlaub} ${t("tage")}${monatsUrlaubMin>0?" / "+formatZeit(monatsUrlaubMin,config.dezimalformat):""}`} />
                <Stat label={t("feiertage")} value={`${monatsFeiertage} ${t("tage")}${monatsFeiertageMin>0?" / "+formatZeit(monatsFeiertageMin,config.dezimalformat):""}`} />
                <Stat label={t("kranktage")} value={`${monatsKranktage} ${t("tage")}${monatsKranktageMin>0?" / "+formatZeit(monatsKranktageMin,config.dezimalformat):""}`} />
                {monatsKindkranktage>0 && <Stat label="👶 Kind krank" value={`${monatsKindkranktage} ${t("tage")}${(()=>{const tt=(config.tagestypen||DEFAULT_TAGESTYPEN).find(t=>t.id==="kindkrank"); return tt&&tt.bezahlt&&monatsKindkranktageMin>0?" / "+formatZeit(monatsKindkranktageMin,config.dezimalformat):"";})()}`} />}
              </div>
              <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid rgba(167,139,250,0.25)"}}>
                <Stat label={t("stunden_inkl")} value={formatZeit(monatsGesamtMin+monatsUrlaubMin+monatsFeiertageMin+monatsKranktageMin, config.dezimalformat)} accent />
                <div style={{marginTop:8,fontSize:11,color:"var(--label-textfarbe, #6b7280)"}}>
                  {t("effektivlohn")} <strong style={{color:"#a78bfa"}}>€ {effektivlohn.toFixed(2)}/h</strong>
                  {Number(config.manuellerEffektivlohn)>0 ? ` ${t("manuell")}` : ` ${t("durchschnitt")}`}
                </div>
              </div>
            </div>

            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {monatsTage.map(({d,dateStr,res})=>{
                const wd=WEEKDAYS[new Date(dateStr+"T12:00:00").getDay()];
                return (
                  <div key={d} onClick={()=>{setSelectedDate(dateStr);setView("erfassen");}}
                    style={{display:"flex",alignItems:"center",justifyContent:"space-between",borderRadius:12,padding:"12px 16px",cursor:"pointer",
                      background: eintraege[dateStr]?(()=>{const tt=tagestypen.find(t=>t.id===(eintraege[dateStr]?.typ||"arbeit"))||tagestypen[0]; return `${tt.color}11`;})():"rgba(255,255,255,0.03)",
                      border:`1px solid ${eintraege[dateStr]?(()=>{const tt=tagestypen.find(t=>t.id===(eintraege[dateStr]?.typ||"arbeit"))||tagestypen[0]; return tt.color+'33';})():"rgba(255,255,255,0.07)"}`}}>
                    <div style={{display:"flex",gap:10,alignItems:"center"}}>
                      <span style={{color:"#a78bfa",fontWeight:700,minWidth:24}}>{wd}</span>
                      <span style={{color:"#9ca3af",fontSize:13}}>{String(d).padStart(2,"0")}.{String(month+1).padStart(2,"0")}.</span>
                      {res ? <span style={{fontSize:13}}>{formatZeit(res.gesamtMin, config.dezimalformat)}</span>
                           : eintraege[dateStr] ? (()=>{const tt=tagestypen.find(t=>t.id===(eintraege[dateStr]?.typ||"arbeit"))||tagestypen[0]; return <span style={{fontSize:13}}>{tt.icon} {t(`dt_${tt.id}`)||tt.label}{tt.bezahlt && !tt.zaehlt ? <span style={{color:"#a78bfa",marginLeft:4}}>{tt.bezahltStunden||config.regelarbeitszeit}h</span> : null}</span>; })()
                           : <span style={{fontSize:12,color:"#4b5563"}}>{t("nicht_erfasst")}</span>}
                    </div>
                    <div style={{textAlign:"right"}}>
                      {res && <div style={{fontWeight:700,color:"#c4b5fd"}}>€ {res.gesamtLohn.toFixed(2)}</div>}
                      {!res && (()=>{const tt=tagestypen.find(t=>t.id===(eintraege[dateStr]?.typ||"arbeit"))||tagestypen[0]; return tt.bezahlt && !tt.zaehlt ? <div style={{fontWeight:700,color:"#c4b5fd"}}>€ {((tt.bezahltStunden||config.regelarbeitszeit)*effektivlohn).toFixed(2)}</div> : null;})()}
                      {res && res.ueberStunden>0 && <div style={{fontSize:11,color:"#f59e0b"}}>+{formatZeit(Math.round(res.ueberStunden*60), config.dezimalformat)} {t("uez")}</div>}
                      {res && res.nachtLohn>0 && <div style={{fontSize:11,color:"#818cf8"}}>🌙 +€ {res.nachtLohn.toFixed(2)}</div>}
                      {eintraege[dateStr]?.kilometer && <div style={{fontSize:11,color:"#60a5fa"}}>🚗 {eintraege[dateStr].kilometer} km</div>}
                      {eintraege[dateStr]?.startkilometer && eintraege[dateStr]?.endkilometer && <div style={{fontSize:11,color:"#60a5fa"}}>🔢→🏁 {Math.max(0,Number(eintraege[dateStr].endkilometer)-Number(eintraege[dateStr].startkilometer))} km</div>}
                      {eintraege[dateStr]?.kunden    && <div style={{fontSize:11,color:"#34d399"}}>📦 {eintraege[dateStr].kunden} {t("kunden")}</div>}
                      {eintraege[dateStr]?.abholer   && <div style={{fontSize:11,color:"#fb923c"}}>🚚 {eintraege[dateStr].abholer} {t("abholer")}</div>}
                      {eintraege[dateStr]?.trinkgeld && <div style={{fontSize:11,color:"#fbbf24"}}>💰 € {Number(eintraege[dateStr].trinkgeld).toFixed(2)}</div>}
                      {eintraege[dateStr]?.nachname && <div style={{fontSize:11,color:"#4ade80"}}>💵 € {Number(eintraege[dateStr].nachname).toFixed(2)}</div>}
                      {eintraege[dateStr]?.patienten && <div style={{fontSize:11,color:"#f0abfc"}}>🏥 {eintraege[dateStr].patienten}</div>}
                      {eintraege[dateStr]?.einsatzort && <div style={{fontSize:11,color:"#94a3b8"}}>📌 {eintraege[dateStr].einsatzort}</div>}
                      {eintraege[dateStr]?.projekt && <div style={{fontSize:11,color:"#86efac"}}>📁 {eintraege[dateStr].projekt}</div>}
                      {res && res.gesamtStunden >= (config.spesenMindestStunden||8) && <div style={{fontSize:11,color:"#34d399"}}>🍽️ {t("spesen")} € {Number(config.spesenBetrag).toFixed(2)}</div>}
                    </div>
                  </div>
                );
              })}
              {monatsTage.length===0 && (
                <div style={{textAlign:"center",color:"var(--label-textfarbe, #6b7280)",padding:40}}>{t("keine_eintraege_monat")}</div>
              )}
            </div>
          </div>
        )}

        {/* ── WOCHE ── */}
        {view==="woche" && (()=>{
          const wochenStart = new Date(selectedWeek+"T12:00:00");
          const wochenTage = Array.from({length:7},(_,i)=>{
            const d=new Date(wochenStart); d.setDate(d.getDate()+i);
            const dateStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            const e=eintraege[dateStr];
            const eTypObj=(config.tagestypen||DEFAULT_TAGESTYPEN).find(t=>t.id===(e?.typ||"arbeit"))||DEFAULT_TAGESTYPEN[0];
            const slWTag = getStundenlohnFuerMonat(config, d.getFullYear(), d.getMonth());
            const res=(e&&eTypObj.zaehlt)?berechneTag(e,config,slWTag):null;
            return {d,dateStr,e,res,eTypObj};
          });
          const wocheGesamtMin=wochenTage.reduce((s,t)=>s+(t.res?.gesamtMin||0),0);
          let wocheUeber=wochenTage.reduce((s,t)=>s+(t.res?.ueberStunden||0),0);
          let wocheMehr=0, wocheZuschlagStd=wocheUeber;
          const wocheNachtStunden=wochenTage.reduce((s,t)=>s+(t.res?.nachtStunden||0),0);
          const wocheNachtLohn=wochenTage.reduce((s,t)=>s+(t.res?.nachtLohn||0),0);
          const wocheEffektivlohn = berechneEffektivlohn(eintraege, config, wochenStart.getMonth(), wochenStart.getFullYear());
          let wocheLohn=wochenTage.reduce((s,t)=>s+(t.res?.gesamtLohn||0),0);
          wochenTage.forEach(t=>{if(t.e&&!t.res&&t.eTypObj.bezahlt&&!t.eTypObj.zaehlt) wocheLohn+=(t.eTypObj.bezahltStunden||config.regelarbeitszeit)*wocheEffektivlohn;});
          // Bei wöchentlicher Überstunden-Methode: Mehrarbeit (ohne Zuschlag) und
          // Überstunden (mit Zuschlag) separat berechnen statt der Tagesmethode.
          if (ueberstundenMethode === "woechentlich") {
            const wRes = berechneEinzelwoche(eintraege, config, wochenStart, tagestypen, getStundenlohnFuerMonat(config, wochenStart.getFullYear(), wochenStart.getMonth()));
            wocheMehr = wRes.mehrStunden;
            wocheZuschlagStd = wRes.ueberStunden;
            wocheUeber = wocheMehr + wocheZuschlagStd;
            wocheLohn = wRes.gesamtLohn + wochenTage.reduce((s,t)=>s+((t.e&&!t.res&&t.eTypObj.bezahlt&&!t.eTypObj.zaehlt)?(t.eTypObj.bezahltStunden||config.regelarbeitszeit)*wocheEffektivlohn:0),0);
          }
          const wocheSpesen=wochenTage.reduce((s,t)=>s+(t.res&&t.res.gesamtStunden>=(config.spesenMindestStunden||8)?Number(config.spesenBetrag):0),0);
          const wocheKm=wochenTage.reduce((s,t)=>s+(Number(t.e?.kilometer)||0),0);
          const wocheKraftstoff=wochenTage.reduce((s,t)=>s+(Number(t.e?.kraftstoff)||0),0);
          const wocheKunden=wochenTage.reduce((s,t)=>s+(Number(t.e?.kunden)||0),0);
          const wocheAbholer=wochenTage.reduce((s,t)=>s+(Number(t.e?.abholer)||0),0);
          const wocheTrinkgeld=wochenTage.reduce((s,t)=>s+(Number(t.e?.trinkgeld)||0),0);
          const wochePatienten=wochenTage.reduce((s,t)=>s+(Number(t.e?.patienten)||0),0);
          const wocheGeldeinnahmen=wochenTage.reduce((s,t)=>s+(Number(t.e?.nachname)||0),0);
          const wocheGefahren=wochenTage.reduce((s,t)=>s+(t.e?.startkilometer&&t.e?.endkilometer?Math.max(0,Number(t.e.endkilometer)-Number(t.e.startkilometer)):0),0);
          const wocheUrlaubMin=wochenTage.reduce((s,t)=>s+(t.e&&!t.res&&t.eTypObj.id==="urlaub"?(t.eTypObj.bezahltStunden||config.regelarbeitszeit)*60:0),0);
          const wocheFeiertageMin=wochenTage.reduce((s,t)=>s+(t.e&&!t.res&&t.eTypObj.id==="feiertag"?(t.eTypObj.bezahltStunden||config.regelarbeitszeit)*60:0),0);
          const wocheKranktageMin=wochenTage.reduce((s,t)=>s+(t.e&&!t.res&&t.eTypObj.id==="krank"?(t.eTypObj.bezahltStunden||config.regelarbeitszeit)*60:0),0);
          const wocheKindkranktageMin=wochenTage.reduce((s,t)=>s+(t.e&&!t.res&&t.eTypObj.id==="kindkrank"?(t.eTypObj.bezahltStunden||config.regelarbeitszeit)*60:0),0);
          const wocheUrlaub=wochenTage.filter(t=>t.e&&!t.res&&t.eTypObj.id==="urlaub").length;
          const wocheFeiertage=wochenTage.filter(t=>t.e&&!t.res&&t.eTypObj.id==="feiertag").length;
          const wocheKranktage=wochenTage.filter(t=>t.e&&!t.res&&t.eTypObj.id==="krank").length;
          const wocheKindkranktage=wochenTage.filter(t=>t.e&&!t.res&&t.eTypObj.id==="kindkrank").length;

          const prevWeek=()=>{ const d=new Date(wochenStart); d.setDate(d.getDate()-7); setSelectedWeek(lokalesDatum(d)); };
          const nextWeek=()=>{ const d=new Date(wochenStart); d.setDate(d.getDate()+7); setSelectedWeek(lokalesDatum(d)); };
          const wocheEnde=new Date(wochenStart); wocheEnde.setDate(wocheEnde.getDate()+6);

          return (
            <div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
                <button onClick={prevWeek} style={navBtn}>‹</button>
                <div style={{textAlign:"center"}}>
                  <div style={{fontWeight:700,fontSize:16}}>{wochenStart.getDate().toString().padStart(2,"0")}.{(wochenStart.getMonth()+1).toString().padStart(2,"0")} – {wocheEnde.getDate().toString().padStart(2,"0")}.{(wocheEnde.getMonth()+1).toString().padStart(2,"0")}.{wocheEnde.getFullYear()}</div>
                  <div style={{fontSize:11,color:"var(--label-textfarbe, #6b7280)",marginTop:2}}>{t("kw")} {(()=>{ const d=new Date(wochenStart); d.setHours(0,0,0,0); d.setDate(d.getDate()+4-(d.getDay()||7)); const y=new Date(d.getFullYear(),0,1); return Math.ceil((((d-y)/86400000)+1)/7); })()}</div>
                </div>
                <button onClick={nextWeek} style={navBtn}>›</button>
              </div>

              <div style={{background:"rgba(167,139,250,0.1)",border:"1px solid rgba(167,139,250,0.3)",borderRadius:16,padding:20,marginBottom:16}}>
                <div style={{fontSize:11,letterSpacing:3,color:"#a78bfa",marginBottom:14,textTransform:"uppercase"}}>{t("wochenuebersicht")}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                  <Stat label={t("gesamtstunden")} value={formatZeit(wocheGesamtMin,config.dezimalformat)} />
                  <Stat label={t("ueberstunden")}   value={formatZeit(Math.round(wocheUeber*60),config.dezimalformat)} accent={wocheUeber>0} />
                  {wocheUeber>0 && wocheZuschlagStd<wocheUeber && (
                    <div style={{gridColumn:"1 / -1",fontSize:11,color:"var(--label-textfarbe, #6b7280)",marginTop:-6}}>
                      {t("davon_mit_zuschlag")}: {formatZeit(Math.round(wocheZuschlagStd*60),config.dezimalformat)}
                    </div>
                  )}
                  {wocheNachtStunden>0 && <Stat label={t("nachtstunden")} value={formatZeit(Math.round(wocheNachtStunden*60),config.dezimalformat)} />}
                  {wocheNachtLohn>0 && <Stat label={t("nachtzulage")} value={`€ ${wocheNachtLohn.toFixed(2)}`} />}
                  <Stat label={t("bruttolohn")} value={`€ ${wocheLohn.toFixed(2)}`} accent />
                  {wocheSpesen>0 && <Stat label={t("spesen")} value={`€ ${wocheSpesen.toFixed(2)}`} />}
                  {(config.erfassenFelder||{}).kilometer!==false && <Stat label={t("gefahrene_km")} value={`${wocheKm.toFixed(1)} km`} />}
                  {(config.erfassenFelder||{}).startkilometer!==false && wocheGefahren>0 && <Stat label="🔢→🏁 Gefahren" value={`${wocheGefahren.toFixed(0)} km`} />}
                  {(config.erfassenFelder||{}).kraftstoff!==false && wocheKraftstoff>0 && <Stat label={t("kraftstoff")} value={`${wocheKraftstoff.toFixed(1)} L`} />}
                  {(config.erfassenFelder||{}).kunden!==false && <Stat label={t("kunden")} value={`${wocheKunden}`} />}
                  {(config.erfassenFelder||{}).abholer!==false && <Stat label={t("abholer")} value={`${wocheAbholer}`} />}
                  {(config.erfassenFelder||{}).trinkgeld!==false && wocheTrinkgeld>0 && <Stat label={t("trinkgeld_gesamt")} value={`€ ${wocheTrinkgeld.toFixed(2)}`} accent />}
                  {(config.erfassenFelder||{}).nachname!==false && wocheGeldeinnahmen>0 && <Stat label={t("nachname")} value={`€ ${wocheGeldeinnahmen.toFixed(2)}`} accent />}
                  {(config.erfassenFelder||{}).patienten!==false && wochePatienten>0 && <Stat label={t("patienten_gesamt")} value={`${wochePatienten}`} />}
                  {wocheUrlaub>0 && <Stat label={t("urlaubstage")} value={`${wocheUrlaub} ${t("tage")}${wocheUrlaubMin>0?" / "+formatZeit(wocheUrlaubMin,config.dezimalformat):""}`} />}
                  {wocheFeiertage>0 && <Stat label={t("feiertage")} value={`${wocheFeiertage} ${t("tage")}${wocheFeiertageMin>0?" / "+formatZeit(wocheFeiertageMin,config.dezimalformat):""}`} />}
                  {wocheKranktage>0 && <Stat label={t("kranktage")} value={`${wocheKranktage} ${t("tage")}${wocheKranktageMin>0?" / "+formatZeit(wocheKranktageMin,config.dezimalformat):""}`} />}
                  {wocheKindkranktage>0 && <Stat label="👶 Kind krank" value={`${wocheKindkranktage} ${t("tage")}${(()=>{const tt=(config.tagestypen||DEFAULT_TAGESTYPEN).find(t=>t.id==="kindkrank"); return tt&&tt.bezahlt&&wocheKindkranktageMin>0?" / "+formatZeit(wocheKindkranktageMin,config.dezimalformat):"";})()}`} />}
                  {(config.eigeneFelder||[]).filter(f=>f.aktiv!==false&&f.typ==="zahl").map(feld=>{
                    const key=`_feld_${feld.id}`;
                    const summe=wochenTage.reduce((s,{e})=>s+(e&&e[key]?Number(e[key])||0:0),0);
                    if(summe===0) return null;
                    return <Stat key={feld.id} label={`${feld.icon||"📋"} ${feld.label}`} value={String(summe)} />;
                  })}
                </div>
                <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid rgba(167,139,250,0.25)"}}>
                  <Stat label={t("stunden_inkl")} value={formatZeit(wocheGesamtMin+wocheUrlaubMin+wocheFeiertageMin+wocheKranktageMin+(()=>{const tt=(config.tagestypen||DEFAULT_TAGESTYPEN).find(t=>t.id==="kindkrank"); return tt&&tt.bezahlt?wocheKindkranktageMin:0;})(),config.dezimalformat)} accent />
                </div>
              </div>

              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {wochenTage.map(({d,dateStr,e,res,eTypObj})=>{
                  const wd=WEEKDAYS[d.getDay()];
                  const isToday=dateStr===lokalesDatum(today);
                  return (
                    <div key={dateStr} onClick={()=>{setSelectedDate(dateStr);setView("erfassen");}}
                      style={{borderRadius:14,padding:"14px 16px",cursor:"pointer",
                        background:e?`${eTypObj.color}11`:"rgba(255,255,255,0.03)",
                        border:`1px solid ${isToday?"#a78bfa":e?eTypObj.color+"33":"rgba(255,255,255,0.07)"}`,
                        outline:isToday?"2px solid rgba(167,139,250,0.4)":"none"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <div style={{display:"flex",gap:10,alignItems:"center"}}>
                          <span style={{fontWeight:700,fontSize:15,color:isToday?"#a78bfa":e?eTypObj.color:"var(--label-textfarbe, #6b7280)",minWidth:28}}>{wd}</span>
                          <span style={{color:"#9ca3af",fontSize:13}}>{d.getDate().toString().padStart(2,"0")}.{(d.getMonth()+1).toString().padStart(2,"0")}.</span>
                          {e && !res && <span style={{fontSize:13}}>{eTypObj.icon} {t(`dt_${eTypObj.id}`)||eTypObj.label}</span>}
                          {e && !res && eTypObj.bezahlt && <span style={{fontSize:13,color:"#a78bfa",marginLeft:4}}>{eTypObj.bezahltStunden||config.regelarbeitszeit}h</span>}
                          {res && <span style={{fontSize:13,color:"#e8e0f0"}}>{formatZeit(res.gesamtMin,config.dezimalformat)}</span>}
                          {!e && <span style={{fontSize:12,color:"#4b5563"}}>{t("nicht_erfasst")}</span>}
                        </div>
                        <div style={{textAlign:"right"}}>
                          {res && <div style={{fontWeight:700,color:"#c4b5fd",fontSize:15}}>€ {res.gesamtLohn.toFixed(2)}</div>}
                          {e && !res && eTypObj.bezahlt && <div style={{fontWeight:700,color:"#c4b5fd",fontSize:15}}>€ {((eTypObj.bezahltStunden||config.regelarbeitszeit)*wocheEffektivlohn).toFixed(2)}</div>}
                          {res && res.ueberStunden>0 && <div style={{fontSize:11,color:"#f59e0b"}}>+{formatZeit(Math.round(res.ueberStunden*60),config.dezimalformat)} {t("uez")}</div>}
                          {res && res.nachtLohn>0 && <div style={{fontSize:11,color:"#818cf8"}}>🌙 +€ {res.nachtLohn.toFixed(2)}</div>}
                          {res && res.gesamtStunden>=(config.spesenMindestStunden||8) && <div style={{fontSize:11,color:"#34d399"}}>🍽️ € {Number(config.spesenBetrag).toFixed(2)}</div>}
                          {e?.kilometer && <div style={{fontSize:11,color:"#60a5fa"}}>🚗 {e.kilometer} km</div>}
                          {e?.startkilometer && e?.endkilometer && <div style={{fontSize:11,color:"#60a5fa"}}>🔢→🏁 {Math.max(0,Number(e.endkilometer)-Number(e.startkilometer))} km</div>}
                          {e?.trinkgeld && <div style={{fontSize:11,color:"#fbbf24"}}>💰 € {Number(e.trinkgeld).toFixed(2)}</div>}
                          {e?.patienten && <div style={{fontSize:11,color:"#f0abfc"}}>🏥 {e.patienten}</div>}
                          {e?.einsatzort && <div style={{fontSize:11,color:"#94a3b8"}}>📌 {e.einsatzort}</div>}
                          {e?.fahrzeug && <div style={{fontSize:11,color:"#94a3b8"}}>🚗 {e.fahrzeug}</div>}
                          {e?.projekt && <div style={{fontSize:11,color:"#86efac"}}>📁 {e.projekt}</div>}
                        </div>
                      </div>
                      {e?.tour && <div style={{marginTop:6,fontSize:12,color:"#a78bfa"}}>🗺️ {e.tour}</div>}
                      {e?.notiz && <div style={{marginTop:4,fontSize:12,color:"var(--label-textfarbe, #6b7280)",fontStyle:"italic"}}>{e.notiz}</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {/* ── JAHR ── */}
        {view==="jahr" && (()=>{
          const MONATE=T.months_short;
          const MONATEFULL=T.months;
          const tagestypen = config.tagestypen||DEFAULT_TAGESTYPEN;

          // Berechne alle 12 Monate
          const monatsDaten = MONATE.map((_,m)=>{
            const daysInMonth = new Date(selectedYear,m+1,0).getDate();
            const slJ = getStundenlohnFuerMonat(config, selectedYear, m);
            let gesamtMin=0,ueberMin=0,ueberZuschlagMin=0,lohn=0,spesen=0,km=0,kraftstoff=0,kunden=0,abholer=0,trinkgeld=0,patienten=0,gefahren=0,geldeinnahmen=0,nachtLohn=0,nachtStunden=0;
            let urlaub=0,feiertage=0,kranktage=0,kindkranktage=0,urlaubMin=0,feiertageMin=0,kranktageMin=0,kindkranktageMin=0,arbeitstage=0;

            if(ueberstundenMethode==="monatlich") {
              const mRes = berechneMonatlUeberstunden(eintraege, config, selectedYear, m, tagestypen, slJ);
              gesamtMin = mRes.gesamtMin;
              ueberMin  = Math.round(mRes.ueberStunden * 60);
              ueberZuschlagMin = ueberMin; // hier bekommen alle Überstunden den Zuschlag
              lohn      = mRes.gesamtLohn;
              spesen    = mRes.spesen;
              arbeitstage = mRes.arbeitstage;
              nachtLohn = mRes.nachtLohn;
              nachtStunden = mRes.nachtStunden;
            } else if(ueberstundenMethode==="woechentlich") {
              const wRes = berechneWoechentlUeberstunden(eintraege, config, selectedYear, m, tagestypen, slJ);
              gesamtMin = wRes.gesamtMin;
              ueberMin  = Math.round((wRes.mehrStunden + wRes.ueberStunden) * 60); // Mehrarbeit (ohne Zuschlag) + Überstunden (mit Zuschlag)
              ueberZuschlagMin = Math.round(wRes.ueberStunden * 60); // nur dieser Teil bekommt den Zuschlag
              lohn      = wRes.gesamtLohn;
              spesen    = wRes.spesen;
              arbeitstage = wRes.arbeitstage;
              nachtLohn = wRes.nachtLohn;
              nachtStunden = wRes.nachtStunden;
            }

            for(let d=1;d<=daysInMonth;d++){
              const dateStr=`${selectedYear}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
              const e=eintraege[dateStr];
              if(!e) continue;
              const typ=tagestypen.find(t=>t.id===(e.typ||"arbeit"))||tagestypen[0];
              if(ueberstundenMethode==="taeglich") {
                const res=typ.zaehlt?berechneTag(e,config,slJ):null;
                if(res){ gesamtMin+=res.gesamtMin; ueberMin+=Math.round(res.ueberStunden*60); ueberZuschlagMin+=Math.round(res.ueberStunden*60); lohn+=res.gesamtLohn; arbeitstage++; nachtLohn+=res.nachtLohn||0; nachtStunden+=res.nachtStunden||0; if(res.gesamtStunden>=(config.spesenMindestStunden||8)) spesen+=Number(config.spesenBetrag); }
              }
              if(!typ.zaehlt){ const h=typ.bezahltStunden||config.regelarbeitszeit;
                // Kindkrank immer zählen (auch wenn nicht bezahlt)
                if(typ.id==="kindkrank"){kindkranktage++;kindkranktageMin+=h*60;}
                if(typ.bezahlt){ const el=berechneEffektivlohn(eintraege,config,m,selectedYear); lohn+=h*el; if(typ.id==="urlaub"){urlaub++;urlaubMin+=h*60;} if(typ.id==="feiertag"){feiertage++;feiertageMin+=h*60;} if(typ.id==="krank"){kranktage++;kranktageMin+=h*60;} }
              }
              km+=Number(e.kilometer)||0; kraftstoff+=Number(e.kraftstoff)||0; kunden+=Number(e.kunden)||0; abholer+=Number(e.abholer)||0;
              trinkgeld+=Number(e.trinkgeld)||0; patienten+=Number(e.patienten)||0;
              geldeinnahmen+=Number(e.nachname)||0;
              if(e.startkilometer&&e.endkilometer) gefahren+=Math.max(0,Number(e.endkilometer)-Number(e.startkilometer));
            }
            return {m,gesamtMin,ueberMin,ueberZuschlagMin,lohn,spesen,km,kraftstoff,kunden,abholer,trinkgeld,patienten,geldeinnahmen,gefahren,urlaub,feiertage,kranktage,kindkranktage,urlaubMin,feiertageMin,kranktageMin,kindkranktageMin,arbeitstage,nachtLohn,nachtStunden};
          });

          // Jahressummen
          const jahresGesamtMin=monatsDaten.reduce((s,m)=>s+m.gesamtMin,0);
          const jahresUeberMin=monatsDaten.reduce((s,m)=>s+m.ueberMin,0);
          const jahresUeberZuschlagMin=monatsDaten.reduce((s,m)=>s+(m.ueberZuschlagMin||0),0);
          const jahresLohn=monatsDaten.reduce((s,m)=>s+m.lohn,0);
          const jahresSpesen=monatsDaten.reduce((s,m)=>s+m.spesen,0);
          const jahresKm=monatsDaten.reduce((s,m)=>s+m.km,0);
          const jahresKraftstoff=monatsDaten.reduce((s,m)=>s+(m.kraftstoff||0),0);
          const jahresKunden=monatsDaten.reduce((s,m)=>s+m.kunden,0);
          const jahresAbholer=monatsDaten.reduce((s,m)=>s+m.abholer,0);
          const jahresTrinkgeld=monatsDaten.reduce((s,m)=>s+m.trinkgeld,0);
          const jahresPatienten=monatsDaten.reduce((s,m)=>s+m.patienten,0);
          const jahresGeldeinnahmen=monatsDaten.reduce((s,m)=>s+m.geldeinnahmen,0);
          const jahresGefahren=monatsDaten.reduce((s,m)=>s+m.gefahren,0);
          const jahresUrlaub=monatsDaten.reduce((s,m)=>s+m.urlaub,0);
          const jahresFeiertage=monatsDaten.reduce((s,m)=>s+m.feiertage,0);
          const jahresKranktage=monatsDaten.reduce((s,m)=>s+m.kranktage,0);
          const jahresKindkranktage=monatsDaten.reduce((s,m)=>s+(m.kindkranktage||0),0);
          const jahresUrlaubMin=monatsDaten.reduce((s,m)=>s+m.urlaubMin,0);
          const jahresFeiertageMin=monatsDaten.reduce((s,m)=>s+m.feiertageMin,0);
          const jahresKranktageMin=monatsDaten.reduce((s,m)=>s+m.kranktageMin,0);
          const jahresKindkranktageMin=monatsDaten.reduce((s,m)=>s+(m.kindkranktageMin||0),0);
          const jahresArbeitstage=monatsDaten.reduce((s,m)=>s+m.arbeitstage,0);
          const jahresNachtLohn=monatsDaten.reduce((s,m)=>s+(m.nachtLohn||0),0);
          const jahresNachtStunden=monatsDaten.reduce((s,m)=>s+(m.nachtStunden||0),0);
          const jahresGesamtInklMin=jahresGesamtMin+jahresUrlaubMin+jahresFeiertageMin+jahresKranktageMin+((()=>{const tt=(config.tagestypen||DEFAULT_TAGESTYPEN).find(t=>t.id==="kindkrank"); return tt&&tt.bezahlt?jahresKindkranktageMin:0;})());

          return (
            <div>
              {/* Jahr Navigation */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
                <button onClick={()=>setSelectedYear(y=>y-1)} style={navBtn}>‹</button>
                <div style={{fontWeight:700,fontSize:22}}>{selectedYear}</div>
                <button onClick={()=>setSelectedYear(y=>y+1)} style={navBtn}>›</button>
              </div>

              {/* Jahreszusammenfassung */}
              <div style={{background:"rgba(167,139,250,0.1)",border:"1px solid rgba(167,139,250,0.3)",borderRadius:16,padding:20,marginBottom:16}}>
                <div style={{fontSize:11,letterSpacing:3,color:"#a78bfa",marginBottom:14,textTransform:"uppercase"}}>{t("jahresuebersicht")} {selectedYear}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                  <Stat label={t("arbeitszeit")}  value={formatZeit(jahresGesamtMin,config.dezimalformat)} />
                  <Stat label={t("ueberstunden")} value={formatZeit(jahresUeberMin,config.dezimalformat)} accent={jahresUeberMin>0} />
                  {jahresUeberMin>0 && jahresUeberZuschlagMin<jahresUeberMin && (
                    <div style={{gridColumn:"1 / -1",fontSize:11,color:"var(--label-textfarbe, #6b7280)",marginTop:-6}}>
                      {t("davon_mit_zuschlag")}: {formatZeit(jahresUeberZuschlagMin,config.dezimalformat)}
                    </div>
                  )}
                  <Stat label={t("bruttolohn")}   value={`€ ${jahresLohn.toFixed(2)}`} accent />
                  {jahresNachtStunden>0 && <Stat label={t("nachtstunden")} value={formatZeit(Math.round(jahresNachtStunden*60), config.dezimalformat)} />}
                  {jahresNachtLohn>0 && <Stat label={t("nachtzulage")} value={`€ ${jahresNachtLohn.toFixed(2)}`} />}
                  {jahresSpesen>0 && <Stat label={t("spesen")} value={`€ ${jahresSpesen.toFixed(2)}`} />}
                  <Stat label={t("arbeitstage")}  value={`${jahresArbeitstage} ${t("tage")}`} />
                  {(config.erfassenFelder||{}).kilometer!==false && <Stat label={t("gefahrene_km")} value={`${jahresKm.toFixed(1)} km`} />}
                  {(config.erfassenFelder||{}).startkilometer!==false && jahresGefahren>0 && <Stat label="🔢→🏁 Gefahren" value={`${jahresGefahren.toFixed(0)} km`} />}
                  {(config.erfassenFelder||{}).kraftstoff!==false && jahresKraftstoff>0 && <Stat label={t("kraftstoff")} value={`${jahresKraftstoff.toFixed(1)} L`} />}
                  {(config.erfassenFelder||{}).kunden!==false && <Stat label={t("kunden")} value={`${jahresKunden}`} />}
                  {(config.erfassenFelder||{}).abholer!==false && <Stat label={t("abholer")} value={`${jahresAbholer}`} />}
                  {(config.erfassenFelder||{}).trinkgeld!==false && jahresTrinkgeld>0 && <Stat label={t("trinkgeld_gesamt")} value={`€ ${jahresTrinkgeld.toFixed(2)}`} accent />}
                  {(config.erfassenFelder||{}).nachname!==false && jahresGeldeinnahmen>0 && <Stat label={t("nachname")} value={`€ ${jahresGeldeinnahmen.toFixed(2)}`} accent />}
                  {(config.erfassenFelder||{}).patienten!==false && jahresPatienten>0 && <Stat label={t("patienten_gesamt")} value={`${jahresPatienten}`} />}
                  {(config.eigeneFelder||[]).filter(f=>f.aktiv!==false&&f.typ==="zahl").map(feld=>{
                    const key=`_feld_${feld.id}`;
                    const summe=Object.values(eintraege).filter(e=>e&&typeof e==="object").reduce((s,e)=>s+(e[key]?Number(e[key])||0:0),0);
                    if(summe===0) return null;
                    return <Stat key={feld.id} label={`${feld.icon||"📋"} ${feld.label}`} value={String(summe)} />;
                  })}
                  {jahresUrlaub>0 && <Stat label={t("urlaubstage")} value={`${jahresUrlaub} ${t("tage")} / ${formatZeit(jahresUrlaubMin,config.dezimalformat)}`} />}
                  {jahresFeiertage>0 && <Stat label={t("feiertage")} value={`${jahresFeiertage} ${t("tage")} / ${formatZeit(jahresFeiertageMin,config.dezimalformat)}`} />}
                  {jahresKranktage>0 && <Stat label={t("kranktage")} value={`${jahresKranktage} ${t("tage")} / ${formatZeit(jahresKranktageMin,config.dezimalformat)}`} />}
                  {jahresKindkranktage>0 && <Stat label="👶 Kind krank" value={`${jahresKindkranktage} ${t("tage")}${(()=>{const tt=(config.tagestypen||DEFAULT_TAGESTYPEN).find(t=>t.id==="kindkrank"); return tt&&tt.bezahlt&&jahresKindkranktageMin>0?" / "+formatZeit(jahresKindkranktageMin,config.dezimalformat):"";})()}`} />}
                </div>
                <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid rgba(167,139,250,0.25)"}}>
                  <Stat label={t("stunden_inkl")} value={formatZeit(jahresGesamtInklMin,config.dezimalformat)} accent />
                </div>
              </div>

              {/* Monatsübersicht */}
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {monatsDaten.map(({m,gesamtMin,ueberMin,lohn,spesen,km,urlaubMin,feiertageMin,kranktageMin,arbeitstage,nachtLohn})=>{
                  const monatGesamtInkl=gesamtMin+urlaubMin+feiertageMin+kranktageMin;
                  const hatDaten=monatGesamtInkl>0||lohn>0;
                  const istAktuellerMonat=m===today.getMonth()&&selectedYear===today.getFullYear();
                  return (
                    <div key={m} onClick={()=>{setSelectedMonth({year:selectedYear,month:m});setView("monat");}}
                      style={{borderRadius:14,padding:"14px 16px",cursor:"pointer",
                        background:hatDaten?"rgba(167,139,250,0.07)":"rgba(255,255,255,0.02)",
                        border:`1px solid ${istAktuellerMonat?"#a78bfa":hatDaten?"rgba(167,139,250,0.3)":"rgba(255,255,255,0.06)"}`,
                        outline:istAktuellerMonat?"2px solid rgba(167,139,250,0.3)":"none"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <div>
                          <div style={{fontWeight:700,fontSize:15,color:istAktuellerMonat?"#a78bfa":hatDaten?"#e8e0f0":"#4b5563"}}>{MONATEFULL[m]}</div>
                          {hatDaten && <div style={{fontSize:12,color:"var(--label-textfarbe, #6b7280)",marginTop:2}}>{arbeitstage} {t("arbeitstage")} · {formatZeit(monatGesamtInkl,config.dezimalformat)}</div>}
                          {!hatDaten && <div style={{fontSize:12,color:"#374151"}}>{t("keine_eintraege")}</div>}
                        </div>
                        <div style={{textAlign:"right"}}>
                          {lohn>0 && <div style={{fontWeight:700,color:"#c4b5fd",fontSize:16}}>€ {lohn.toFixed(2)}</div>}
                          {ueberMin>0 && <div style={{fontSize:11,color:"#f59e0b"}}>+{formatZeit(ueberMin,config.dezimalformat)} {t("uez")}</div>}
                          {nachtLohn>0 && <div style={{fontSize:11,color:"#818cf8"}}>🌙 € {nachtLohn.toFixed(2)}</div>}
                          {spesen>0 && <div style={{fontSize:11,color:"#34d399"}}>🍽️ € {spesen.toFixed(2)}</div>}
                          {km>0 && <div style={{fontSize:11,color:"#60a5fa"}}>🚗 {km.toFixed(1)} km</div>}
                          {monatsDaten.find(md=>md.m===m)?.gefahren>0 && <div style={{fontSize:11,color:"#60a5fa"}}>🔢→🏁 {monatsDaten.find(md=>md.m===m).gefahren.toFixed(0)} km</div>}
                          {monatsDaten.find(md=>md.m===m)?.trinkgeld>0 && <div style={{fontSize:11,color:"#fbbf24"}}>💰 € {monatsDaten.find(md=>md.m===m).trinkgeld.toFixed(2)}</div>}
                          {monatsDaten.find(md=>md.m===m)?.geldeinnahmen>0 && <div style={{fontSize:11,color:"#4ade80"}}>💵 € {monatsDaten.find(md=>md.m===m).geldeinnahmen.toFixed(2)}</div>}
                          {monatsDaten.find(md=>md.m===m)?.patienten>0 && <div style={{fontSize:11,color:"#f0abfc"}}>🏥 {monatsDaten.find(md=>md.m===m).patienten}</div>}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {/* ── NETTO ── */}
        {view==="netto" && (()=>{
          const prevMonthNetto=()=>setSelectedMonth(prev=>{const m=prev.month-1<0?11:prev.month-1;const y=prev.month-1<0?prev.year-1:prev.year;return{year:y,month:m};});
          const nextMonthNetto=()=>setSelectedMonth(prev=>{const m=prev.month+1>11?0:prev.month+1;const y=prev.month+1>11?prev.year+1:prev.year;return{year:y,month:m};});
          // Detaillierte Stundenaufschlüsselung für den Monat
          const nettoEffektivlohn = berechneEffektivlohn(eintraege, config, month, year);
          const bruttoAbzuegeTotal = (config.zusatzAbzuege||[]).filter(a=>a.typ==="brutto").reduce((s,a)=>s+Number(a.betrag||0),0);
          let nt_normalMin=0, nt_mehrMin=0, nt_ueberMin=0, nt_urlaubMin=0, nt_feierMin=0, nt_krankMin=0, nt_kindkrankMin=0, nt_spesen=0, nt_nachtLohn=0, nt_nachtStunden=0;
          const tagestypenN = config.tagestypen||DEFAULT_TAGESTYPEN;
          const daysInMonthN = new Date(year,month+1,0).getDate();
          const slN = getStundenlohnFuerMonat(config, year, month);
          const ueberstundenMethodeN = config.ueberstundenMethode||(config.ueberstundenMonatlich?"monatlich":"taeglich");

          if(ueberstundenMethodeN==="woechentlich") {
            // Wöchentliche Aufschlüsselung
            const wRes = berechneWoechentlUeberstunden(eintraege, config, year, month, tagestypenN, slN);
            nt_normalMin = wRes.normalStunden * 60;
            nt_mehrMin   = wRes.mehrStunden   * 60;
            nt_ueberMin  = wRes.ueberStunden  * 60;
            nt_nachtLohn = wRes.nachtLohn;
            nt_nachtStunden = wRes.nachtStunden;
            nt_spesen    = wRes.spesen;
          } else if(ueberstundenMethodeN==="monatlich") {
            const mRes = berechneMonatlUeberstunden(eintraege, config, year, month, tagestypenN, slN);
            nt_normalMin = mRes.normalStunden * 60;
            nt_mehrMin   = mRes.ueberStunden  * 60; // monatlich: alles über Soll = Mehrarbeit
            nt_ueberMin  = 0;
            nt_nachtLohn = mRes.nachtLohn;
            nt_nachtStunden = mRes.nachtStunden;
            nt_spesen    = mRes.spesen;
          } else {
            // Täglich
            for(let d=1;d<=daysInMonthN;d++){
              const dateStr=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
              const e=eintraege[dateStr]; if(!e) continue;
              const typ=tagestypenN.find(t=>t.id===(e.typ||"arbeit"))||tagestypenN[0];
              if(typ.zaehlt){
                const res=berechneTag(e,config,slN);
                if(res){ nt_normalMin+=res.normalStunden*60; nt_ueberMin+=res.ueberStunden*60; nt_nachtLohn+=res.nachtLohn||0; nt_nachtStunden+=(res.nachtStunden||0); if(res.gesamtStunden>=(config.spesenMindestStunden||8)) nt_spesen+=Number(config.spesenBetrag)||0; }
              }
            }
          }
          // Urlaub/Feiertag/Krank immer separat
          for(let d=1;d<=daysInMonthN;d++){
            const dateStr=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
            const e=eintraege[dateStr]; if(!e) continue;
            const typ=tagestypenN.find(t=>t.id===(e.typ||"arbeit"))||tagestypenN[0];
            if(!typ.zaehlt&&typ.bezahlt){
              const h=(typ.bezahltStunden||config.regelarbeitszeit)*60;
              if(typ.id==="urlaub") nt_urlaubMin+=h;
              else if(typ.id==="feiertag") nt_feierMin+=h;
              else if(typ.id==="kindkrank") nt_kindkrankMin+=h;
              else if(typ.id==="krank") nt_krankMin+=h;
            }
          }

          const slNetto = slN;
          const nt_normalLohn    = (nt_normalMin/60)*slNetto;
          const nt_mehrLohn      = (nt_mehrMin/60)*slNetto;   // Mehrarbeit ohne Zuschlag
          const nt_ueberLohn     = (nt_ueberMin/60)*slNetto;  // ÜS Grundlohn
          const nt_ueberZuschlag = (nt_ueberMin/60)*slNetto*(config.ueberstundenZuschlag/100);
          const nt_urlaubLohn    = (nt_urlaubMin/60)*nettoEffektivlohn;
          const nt_feierLohn     = (nt_feierMin/60)*nettoEffektivlohn;
          const nt_krankLohn     = (nt_krankMin/60)*nettoEffektivlohn;
          const nt_kindkrankLohn = (nt_kindkrankMin/60)*nettoEffektivlohn;

          const AufschlRow = ({label, stunden, satz, betrag, color="#9ca3af"}) => stunden > 0 ? (
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,fontSize:13}}>
              <div>
                <span style={{color}}>{label}</span>
                <span style={{color:"#4b5563",fontSize:11,marginLeft:8}}>{stunden.toFixed(2)}h × € {satz.toFixed(2)}</span>
              </div>
              <span style={{color:"#e8e0f0",fontWeight:600}}>€ {betrag.toFixed(2)}</span>
            </div>
          ) : null;

          return (
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
              <button onClick={prevMonthNetto} style={navBtn}>‹</button>
              <div style={{textAlign:"center"}}>
                <div style={{fontWeight:700,fontSize:18}}>Brutto → Netto</div>
                <div style={{fontSize:13,color:"#a78bfa"}}>{T.months[month]} {year}</div>
              </div>
              <button onClick={nextMonthNetto} style={navBtn}>›</button>
            </div>

            {/* Stundenaufschlüsselung */}
            <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:16,padding:20,marginBottom:12}}>
              <div style={{fontSize:11,letterSpacing:3,color:"#a78bfa",marginBottom:14,textTransform:"uppercase"}}>{t("lohnberechnung")}</div>
              <AufschlRow label={t("normalstunden")}        stunden={nt_normalMin/60}    satz={slNetto}                              betrag={nt_normalLohn} />
              {nt_mehrMin>0 && <AufschlRow label="Mehrarbeit (kein Zuschlag)" stunden={nt_mehrMin/60} satz={slNetto} betrag={nt_mehrLohn} color="#f59e0b"/>}
              <AufschlRow label={t("ueberstunden_label")}          stunden={nt_ueberMin/60}     satz={slNetto}                              betrag={nt_ueberLohn} color="#f59e0b"/>
              <AufschlRow label={`${t("ueberstunden_label")} ${t("zuschlag_summary")} ${config.ueberstundenZuschlag}%`} stunden={nt_ueberMin/60} satz={slNetto*(config.ueberstundenZuschlag/100)} betrag={nt_ueberZuschlag} color="#fbbf24"/>
              {nt_nachtLohn>0 && <AufschlRow label={`🌙 ${t("nachtschicht_kurz").replace("🌙 ","")} ${Number(config.nachtschichtzulage)||25}%`} stunden={nt_nachtStunden} satz={slNetto*((Number(config.nachtschichtzulage)||25)/100)} betrag={nt_nachtLohn} color="#818cf8"/>}
              <AufschlRow label={t("urlaubslohn")}          stunden={nt_urlaubMin/60}    satz={nettoEffektivlohn}                               betrag={nt_urlaubLohn} color="#34d399"/>
              <AufschlRow label={t("feiertagsbez")}   stunden={nt_feierMin/60}     satz={nettoEffektivlohn}                               betrag={nt_feierLohn} color="#60a5fa"/>
              <AufschlRow label={t("kranklohn")}            stunden={nt_krankMin/60}     satz={nettoEffektivlohn}                               betrag={nt_krankLohn} color="#f87171"/>
              <AufschlRow label={t("kindkrank_bez")}   stunden={nt_kindkrankMin/60} satz={nettoEffektivlohn}                               betrag={nt_kindkrankLohn} color="#f87171"/>
              {(config.zusatzBezuege||[]).filter(a=>(a.typ||"brutto")==="brutto"&&Number(a.betrag)>0).map((b,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,fontSize:13}}>
                  <span style={{color:"#34d399"}}>{b.name||"Zusatzbezug"}</span>
                  <span style={{color:"#e8e0f0",fontWeight:600}}>€ {Number(b.betrag).toFixed(2)}</span>
                </div>
              ))}
              {einmaligBrutto>0 && (
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,fontSize:13}}>
                  <span style={{color:"#f59e0b"}}>{t("einmalig_brutto")}</span>
                  <span style={{color:"#e8e0f0",fontWeight:600}}>+ € {einmaligBrutto.toFixed(2)}</span>
                </div>
              )}
              <div style={{display:"flex",justifyContent:"space-between",paddingTop:10,borderTop:"1px solid rgba(255,255,255,0.08)",fontWeight:700,fontSize:14}}>
                <span style={{color:"#a78bfa"}}>{t("gesamtbrutto")}</span>
                <span style={{color:"#fff"}}>€ {(monatsLohn+zusatzBezuegeBrutto+einmaligBrutto).toFixed(2)}</span>
              </div>
              {nettoEffektivlohn !== config.stundenlohn && (
                <div style={{marginTop:8,fontSize:11,color:"var(--label-textfarbe, #6b7280)"}}>{t("effektivlohn")} <strong style={{color:"#a78bfa"}}>€ {nettoEffektivlohn.toFixed(2)}/h</strong> {t("durchschnitt")}</div>
              )}
            </div>

            {/* Einmalzahlungen Verwaltung */}
            {(()=>{
              const einmaligKeyN = `${year}-${String(month+1).padStart(2,"0")}`;
              const storageKey = `__einmalig__${einmaligKeyN}`;
              const liste = eintraege[storageKey] || [];
              const setListe = fn => setEintraege(prev=>({...prev,[storageKey]:fn(prev[storageKey]||[])}));
              return (
              <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:16,padding:20,marginBottom:12}}>
                <div style={{fontSize:11,letterSpacing:3,color:"#a78bfa",marginBottom:12,textTransform:"uppercase"}}>{t("einmalig_abzuege_titel")}</div>
                <div style={{fontSize:12,color:"var(--label-textfarbe, #6b7280)",marginBottom:12}}>{t("einmalig_hint")} {T.months[month]} {year}</div>
                {liste.map((item,i)=>(
                  <div key={i} style={{marginBottom:12}}>
                    <div style={{display:"flex",gap:8,marginBottom:6,alignItems:"center"}}>
                      <input type="text" value={item.name||""} placeholder={t("bezeichnung")}
                        onChange={e=>setListe(l=>{const n=[...l];n[i]={...n[i],name:e.target.value};return n;})}
                        style={{...inp,flex:2,fontSize:13,padding:"9px 12px"}} />
                      <input type="text" inputMode="decimal" min="0" value={item.betrag||""} placeholder="€"
                        onChange={e=>setListe(l=>{const n=[...l];n[i]={...n[i],betrag:e.target.value.replace(",",".")};return n;})}
                        style={{...inp,flex:1,fontSize:13,padding:"9px 12px"}} />
                      <button onClick={()=>setListe(l=>{const n=[...l];n.splice(i,1);return n;})}
                        style={{background:"rgba(248,113,113,0.15)",border:"1px solid rgba(248,113,113,0.3)",borderRadius:8,color:"#f87171",cursor:"pointer",padding:"9px 11px",fontSize:15,flexShrink:0}}>✕</button>
                    </div>
                    <div style={{display:"flex",gap:6}}>
                      {[["brutto",t("zahlung_plus"),"#f59e0b"],["netto",t("netto_plus"),"#34d399"],["abzug",t("abzug_minus"),"#f87171"]].map(([typ,label,col])=>(
                        <button key={typ} onClick={()=>setListe(l=>{const n=[...l];n[i]={...n[i],typ};return n;})}
                          style={{flex:1,padding:"5px 0",borderRadius:8,border:"1px solid",cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:"inherit",
                            borderColor:(item.typ||"brutto")===typ?col:"rgba(255,255,255,0.1)",
                            background:(item.typ||"brutto")===typ?`${col}22`:"rgba(255,255,255,0.03)",
                            color:(item.typ||"brutto")===typ?col:"var(--label-textfarbe, #6b7280)"}}>
                          {label}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>setListe(l=>[...l,{name:"",betrag:"",typ:"brutto"}])}
                    style={{flex:1,padding:"10px",borderRadius:10,border:"1px dashed rgba(245,158,11,0.4)",background:"rgba(245,158,11,0.05)",color:"#f59e0b",cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>
                    {t("zahlung_btn")}
                  </button>
                  <button onClick={()=>setListe(l=>[...l,{name:"",betrag:"",typ:"abzug"}])}
                    style={{flex:1,padding:"10px",borderRadius:10,border:"1px dashed rgba(248,113,113,0.4)",background:"rgba(248,113,113,0.05)",color:"#f87171",cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>
                    {t("abzug_btn")}
                  </button>
                </div>
              </div>
              );
            })()}

            <div style={{background:"rgba(167,139,250,0.1)",border:"1px solid rgba(167,139,250,0.3)",borderRadius:16,padding:20,marginBottom:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
                <span style={{fontSize:11,letterSpacing:3,color:"#a78bfa",textTransform:"uppercase"}}>{t("bruttogehalt")}</span>
                <span style={{fontSize:22,fontWeight:700,color:"#fff"}}>€ {(monatsLohn+einmaligBrutto).toFixed(2)}</span>
              </div>
              {einmaligBrutto>0 && (
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--label-textfarbe, #6b7280)",marginBottom:4}}>
                  <span>🎁 davon Einmalzahlung(en) diesen Monat</span>
                  <span>€ {einmaligBrutto.toFixed(2)}</span>
                </div>
              )}
              {getBavFuerMonat(config,year,month)>0 && (
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--label-textfarbe, #6b7280)",marginBottom:4}}>
                  <span>🏦 {t("bav_label")} (steuer-/SV-frei)</span>
                  <span>- € {getBavFuerMonat(config,year,month).toFixed(2)}</span>
                </div>
              )}
              {nettoMonat.sachbezugBrutto>0 && (
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--label-textfarbe, #6b7280)",marginBottom:4}}>
                  <span>💳 Sachbezug (z.B. AG-Zuschuss) – für Steuer/SV wieder hinzugerechnet</span>
                  <span>+ € {nettoMonat.sachbezugBrutto.toFixed(2)}</span>
                </div>
              )}
              {(Number(config.bav)>0||bruttoAbzuegeTotal>0||nettoMonat.sachbezugBrutto>0) && <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#9ca3af",marginBottom:4}}>
                <span>{t("steuerbrutto")}</span>
                <span style={{fontWeight:600}}>€ {nettoMonat.steuerBrutto.toFixed(2)}</span>
              </div>}
              <div style={{fontSize:11,color:"var(--label-textfarbe, #6b7280)"}}>
                SK {config.steuerklasse} · {BUNDESLAENDER.find(b=>b[0]===config.bundesland)?.[1]||config.bundesland}
                {config.kirchensteuer?" · Kirchensteuer":""}
                {Number(config.kinderfreibetrage)>0?` · ${config.kinderfreibetrage} Kinderfreibetrag`:""}
              </div>
            </div>

            <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:16,padding:20,marginBottom:12}}>
              <div style={{fontSize:11,letterSpacing:3,color:"#a78bfa",marginBottom:12,textTransform:"uppercase"}}>{t("sozialversicherung")}</div>
              {[[t("rentenversicherung"),nettoMonat.rv],[t("arbeitslosenversicherung"),nettoMonat.av],[t("krankenversicherung"),nettoMonat.kv],[t("pflegeversicherung"),nettoMonat.pv]].map(([label,val])=>(
                <div key={label} style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:13}}>
                  <span style={{color:"#9ca3af"}}>{label}</span>
                  <span style={{color:"#f87171"}}>- € {val.toFixed(2)}</span>
                </div>
              ))}
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:13}}>
                <span style={{color:"#9ca3af"}}>{t("kv_zusatz_label")} ({(config.kvZusatzAN!==undefined&&config.kvZusatzAN!==""?Number(config.kvZusatzAN):(Number(config.kvZusatz)||2.98)/2).toFixed(2)}%)</span>
                <span style={{color:"#f87171"}}>- € {nettoMonat.zvBei.toFixed(2)}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",paddingTop:10,borderTop:"1px solid rgba(255,255,255,0.08)",fontWeight:700}}>
                <span style={{color:"#9ca3af"}}>{t("sv_gesamt")}</span>
                <span style={{color:"#f87171"}}>- € {nettoMonat.svGesamtMitZV.toFixed(2)}</span>
              </div>
            </div>

            <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:16,padding:20,marginBottom:16}}>
              <div style={{fontSize:11,letterSpacing:3,color:"#a78bfa",marginBottom:12,textTransform:"uppercase"}}>{t("steuern")}</div>
              {[[t("lohnsteuer"),nettoMonat.lohnsteuer],[t("solidaritaetszuschlag"),nettoMonat.soli],...(config.kirchensteuer?[[t("kirchensteuer"),nettoMonat.kirchensteuer]]:[])].map(([label,val])=>(
                <div key={label} style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:13}}>
                  <span style={{color:"#9ca3af"}}>{label}</span>
                  <span style={{color:"#f87171"}}>- € {val.toFixed(2)}</span>
                </div>
              ))}
            </div>

            {/* Gesetzliches Netto – vor Zusatzabzügen */}
            {(nettoMonat.zusatzAbzuege.length > 0 || (Number(config.vl)||0) > 0) && (
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"linear-gradient(135deg,rgba(167,139,250,0.15),rgba(139,92,246,0.1))",border:"1px solid rgba(167,139,250,0.5)",borderRadius:14,padding:"16px 18px",marginBottom:16}}>
                <span style={{fontSize:13,fontWeight:600,color:"#c4b5fd",letterSpacing:1}}>⚖️ Gesetzliches Netto</span>
                <span style={{fontSize:22,fontWeight:700,color:"#a78bfa"}}>€ {(nettoMonat.netto + nettoMonat.zusatzGesamt + (Number(config.vl)||0)).toFixed(2)}</span>
              </div>
            )}

            {nettoMonat.zusatzAbzuege && nettoMonat.zusatzAbzuege.length > 0 && (
              <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:16,padding:20,marginBottom:16}}>
                <div style={{fontSize:11,letterSpacing:3,color:"#a78bfa",marginBottom:12,textTransform:"uppercase"}}>{t("zusatzabzuege")}</div>
                {nettoMonat.zusatzAbzuege.map((a,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:13}}>
                    <span style={{color:"#9ca3af"}}>{a.name||"Abzug"}</span>
                    <span style={{color:"#f87171"}}>- € {Number(a._preset==="avmg" ? getAvmgFuerMonat(config,year,month) : a.betrag||0).toFixed(2)}</span>
                  </div>
                ))}
                {(Number(config.vl)||0) > 0 && (
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:13}}>
                    <span style={{color:"#9ca3af"}}>🏦 VL / Bausparvertrag</span>
                    <span style={{color:"#f87171"}}>- € {Number(config.vl).toFixed(2)}</span>
                  </div>
                )}
                <div style={{display:"flex",justifyContent:"space-between",paddingTop:10,borderTop:"1px solid rgba(255,255,255,0.08)",fontWeight:700}}>
                  <span style={{color:"#9ca3af"}}>{t("sv_gesamt")}</span>
                  <span style={{color:"#f87171"}}>- € {(nettoMonat.zusatzGesamt + (Number(config.vl)||0)).toFixed(2)}</span>
                </div>
              </div>
            )}

                          = <strong style={{color:typ.color}}>€ {((typ.bezahltStunden||config.regelarbeitszeit)*config.stundenlohn).toFixed(2)}</strong> {t("pro_tag")}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
              ))}
              <button onClick={()=>setConfirmDialog({message:t("tagestypen_reset_confirm"), onConfirm:()=>setConfig(prev=>({...prev,tagestypen:DEFAULT_TAGESTYPEN}))})}
                style={{width:"100%",padding:"12px",borderRadius:12,border:"1px dashed rgba(248,113,113,0.4)",background:"rgba(248,113,113,0.05)",color:"#f87171",cursor:"pointer",fontSize:14,fontFamily:"inherit",marginBottom:16,marginTop:8}}>
                {t("tagestypen_reset")}
              </button>

              {/* Datensicherung */}
              <div style={{fontSize:13,letterSpacing:2,color:"#a78bfa",textTransform:"uppercase",marginBottom:14,borderTop:"1px solid rgba(255,255,255,0.08)",paddingTop:20,marginTop:4}}>
                📦 {t("datensicherung")}
              </div>
              <div style={{fontSize:12,color:"var(--label-textfarbe, #6b7280)",marginBottom:12,lineHeight:1.6}}>
                {t("datensicherung_hint")}
              </div>
              <button onClick={()=>{
                const data = { eintraege, config, exportDatum: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                const datum = lokalesDatum(new Date());
                a.href=url; a.download=`WorkTracker_Backup_${datum}.json`; a.click();
                URL.revokeObjectURL(url);
              }} style={{width:"100%",padding:"13px",borderRadius:12,border:"1px solid rgba(52,211,153,0.4)",background:"rgba(52,211,153,0.08)",color:"#34d399",cursor:"pointer",fontSize:14,fontFamily:"inherit",marginBottom:10,fontWeight:600}}>
                {t("export_btn")}
              </button>
              <label style={{display:"block",width:"100%",padding:"13px",borderRadius:12,border:"1px solid rgba(96,165,250,0.4)",background:"rgba(96,165,250,0.08)",color:"#60a5fa",cursor:"pointer",fontSize:14,fontFamily:"inherit",fontWeight:600,textAlign:"center",boxSizing:"border-box",marginBottom:20}}>
                {t("import_btn")}
                <input type="file" accept=".json" style={{display:"none"}} onChange={e=>{
                  const file=e.target.files[0]; if(!file) return;
                  const reader=new FileReader();
                  reader.onload=ev=>{
                    try {
                      const data=JSON.parse(ev.target.result);
                      if(!data.eintraege) { alert(t("err_backup")); return; }
                      const datumStr = data.exportDatum?new Date(data.exportDatum).toLocaleDateString("de-DE"):"?";
                      setConfirmDialog({message:`${t("backup_bestaetigen")} ${datumStr} ${t("backup_bestaetigen2")}`, onConfirm:()=>{
                        setEintraege(data.eintraege);
                        if(data.config) setConfig(data.config);
                        alert(t("backup_ok"));
                      }});
                    } catch { alert(t("err_datei")); }
                  };
                  reader.readAsText(file);
                  e.target.value="";
                }} />
              </label>

              {/* App zurücksetzen */}
              <div style={{fontSize:13,letterSpacing:2,color:"#a78bfa",textTransform:"uppercase",marginBottom:14,borderTop:"1px solid rgba(255,255,255,0.08)",paddingTop:20,marginTop:4}}>
                {t("app_reset")}
              </div>
              <button onClick={()=>setConfirmDialog({message:t("app_reset_confirm"), onConfirm:()=>setConfig(prev=>({...prev,appName:"WorkTracker",appAccentColor:"#a78bfa",appStartView:"erfassen",appWaehrung:"€",appKompaktansicht:false,appHintergrund:"linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%)",appEingabeTextfarbe:"#ffffff",appLabelTextfarbe:"#000000",appZoom:1}))})}
                style={{width:"100%",padding:"13px",borderRadius:12,border:"1px dashed rgba(248,113,113,0.4)",background:"rgba(248,113,113,0.05)",color:"#f87171",cursor:"pointer",fontSize:14,fontFamily:"inherit",marginBottom:8}}>
                {t("app_reset_btn")}
              </button>
              <button onClick={()=>setConfirmDialog({message:t("alle_daten_confirm"), onConfirm:()=>{ localStorage.removeItem("arbeitszeit_eintraege"); localStorage.removeItem("arbeitszeit_config"); window.location.reload(); }})}
                style={{width:"100%",padding:"13px",borderRadius:12,border:"1px solid rgba(248,113,113,0.5)",background:"rgba(248,113,113,0.1)",color:"#f87171",cursor:"pointer",fontSize:14,fontFamily:"inherit",fontWeight:700,marginBottom:24}}>
                {t("alle_daten_loeschen")}
              </button>

              {/* App-Info */}
              <div style={{padding:16,background:"rgba(255,255,255,0.03)",borderRadius:12,border:"1px solid rgba(255,255,255,0.07)",fontSize:12,color:"#4b5563",textAlign:"center",lineHeight:1.8}}>
                <div style={{fontSize:18,marginBottom:6}}>⚙️</div>
                <div style={{color:"var(--label-textfarbe, #6b7280)",fontWeight:600}}>{config.appName||"WorkTracker"}</div>
                <div>{t("app_info_label")}</div>
                <div style={{marginTop:6,fontSize:11}}>{t("app_info_local")}</div>
              </div>

            </div>)}

          </div>
        )}
      </div>
    </div>

    {/* Eigener Bestätigungsdialog – ersetzt window.confirm, das in manchen App-WebViews nicht funktioniert */}
    {confirmDialog && (
      <div onClick={()=>setConfirmDialog(null)}
        style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:24}}>
        <div onClick={e=>e.stopPropagation()}
          style={{background:"#1a1a2e",border:"1px solid rgba(255,255,255,0.12)",borderRadius:16,padding:22,maxWidth:340,width:"100%",boxShadow:"0 10px 40px rgba(0,0,0,0.5)"}}>
          <div style={{fontSize:14,color:"#e8e0f0",whiteSpace:"pre-line",marginBottom:20,lineHeight:1.5}}>{confirmDialog.message}</div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfirmDialog(null)}
              style={{flex:1,padding:"12px",borderRadius:12,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.04)",color:"#9ca3af",cursor:"pointer",fontSize:14,fontFamily:"inherit",fontWeight:600}}>
              {t("dialog_abbrechen")}
            </button>
            <button onClick={()=>{ confirmDialog.onConfirm(); setConfirmDialog(null); }}
              style={{flex:1,padding:"12px",borderRadius:12,border:"1px solid rgba(248,113,113,0.5)",background:"rgba(248,113,113,0.15)",color:"#f87171",cursor:"pointer",fontSize:14,fontFamily:"inherit",fontWeight:700}}>
              {t("dialog_bestaetigen")}
            </button>
          </div>
        </div>
      </div>
    )}

    {/* Bottom Nav — bewusst AUSSERHALB des gezoomten Containers, damit sie auf
        Samsung-Geräten bei "Ansichtsgröße: Groß" nicht aus dem Bildschirm rutscht */}
    <div style={{position:"fixed",bottom:0,left:0,right:0,background:`linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)), ${config.appHintergrund||"linear-gradient(135deg,#2e2a5c 0%,#4a4394 50%,#3b3670 100%)"}`,backgroundAttachment:"fixed",backdropFilter:"blur(12px)",borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",justifyContent:"space-around",padding:"10px 0 20px",zIndex:100}}>
      {[{id:"erfassen",icon:"⏱",labelKey:"nav_erfassen"},{id:"woche",icon:"🗓️",labelKey:"nav_woche"},{id:"monat",icon:"📅",labelKey:"nav_monat"},{id:"jahr",icon:"📆",labelKey:"nav_jahr"},{id:"netto",icon:"💶",labelKey:"nav_netto"},{id:"einstellungen",icon:"⚙️",labelKey:"nav_einstellungen"}].map(tab=>(
        <button key={tab.id} onClick={()=>setView(tab.id)}
          style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,color:view===tab.id?(config.appAccentColor||"#a78bfa"):(config.appLabelTextfarbe||"#6b7280"),fontSize:10,letterSpacing:0.5,transition:"color 0.2s",padding:"4px 8px"}}>
          <span style={{fontSize:20}}>{tab.icon}</span>
          {t(tab.labelKey)}
        </button>
      ))}
    </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
