// Gibt den Stundenlohn zurück, der für ein bestimmtes Jahr/Monat gültig war.
// lohnVerlauf: [{ab: "YYYY-MM", lohn: number}] – ab = erster Gültigkeitsmonat (inkl.)
function getStundenlohnFuerMonat(config, year, month) {
  const verlauf = (config.lohnVerlauf || []).slice().sort((a,b) => a.ab < b.ab ? -1 : 1);
  const monatStr = `${year}-${String(month+1).padStart(2,"0")}`;
  let lohn = config.stundenlohn;
  for (const eintrag of verlauf) {
    if (eintrag.ab <= monatStr) lohn = Number(eintrag.lohn);
  }
  return lohn;
}

// avmgVerlauf: [{ab: "YYYY-MM", betrag: number}] – Verlauf des AVmG-Netto-Abzugs
function getAvmgFuerMonat(config, year, month) {
  const verlauf = (config.avmgVerlauf || []).slice().sort((a,b) => a.ab < b.ab ? -1 : 1);
  const monatStr = `${year}-${String(month+1).padStart(2,"0")}`;
  // Basiswert: AVmG aus zusatzAbzuege (für Rückwärtskompatibilität)
  const basis = (config.zusatzAbzuege||[]).find(a=>a._preset==="avmg");
  let betrag = basis ? Number(basis.betrag||0) : 0;
  for (const eintrag of verlauf) {
    if (eintrag.ab <= monatStr) betrag = Number(eintrag.betrag);
  }
  return betrag;
}

// bavVerlauf: [{ab: "YYYY-MM", betrag: number}] – Verlauf der bAV
function getBavFuerMonat(config, year, month) {
  const verlauf = (config.bavVerlauf || []).slice().sort((a,b) => a.ab < b.ab ? -1 : 1);
  const monatStr = `${year}-${String(month+1).padStart(2,"0")}`;
  let betrag = Number(config.bav) || 0;
  for (const eintrag of verlauf) {
    if (eintrag.ab <= monatStr) betrag = Number(eintrag.betrag);
  }
  return betrag;
}

// Lokales Datum als "YYYY-MM-DD" (toISOString() liefert UTC und springt
// zwischen 00:00 und 01:00/02:00 Uhr deutscher Zeit auf den Vortag).
function lokalesDatum(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function parseTime(str) {
  if (!str) return null;
  const [h, m] = str.split(":").map(Number);
  return h * 60 + m;
}
function formatMinutes(min) {
  const h = Math.floor(Math.abs(min) / 60);
  const m = Math.abs(min) % 60;
  return `${h}h ${m.toString().padStart(2,"0")}min`;
}

function formatZeit(min, dezimal) {
  if (dezimal) {
    const h = Math.abs(min) / 60;
    return `${h.toFixed(2)}h`;
  }
  const h = Math.floor(Math.abs(min) / 60);
  const m = Math.abs(min) % 60;
  return `${h}h ${m.toString().padStart(2,"0")}min`;
}

function berechneNachtMinuten(workStart, workEnde, nachtStart, nachtEnde) {
  const ws = workStart;
  const we = workEnde <= workStart ? workEnde + 1440 : workEnde;
  const ns = nachtStart;
  const ne = nachtEnde <= nachtStart ? nachtEnde + 1440 : nachtEnde;
  let overlap = 0;
  for (const offset of [0, 1440, -1440]) {
    const nsO = ns + offset, neO = ne + offset;
    const s = Math.max(ws, nsO);
    const e = Math.min(we, neO);
    if (e > s) overlap += e - s;
  }
  return overlap;
}

function berechneTag(eintrag, config, stundenlohnOverride) {
  const start = parseTime(eintrag.start), endeRoh = parseTime(eintrag.ende);
  const pause = Number(eintrag.pause) || 0;
  if (start === null || endeRoh === null) return null;
  // Schicht über Mitternacht (z.B. 22:00 -> 06:00): Ende liegt vor/gleich Start -> nächster Tag
  const ende = endeRoh <= start ? endeRoh + 1440 : endeRoh;
  const gesamtMin = ende - start - pause;
  if (gesamtMin <= 0) return null;
  const gesamtStunden = gesamtMin / 60;
  const ueberGrenze = config.ueberstundenMindestStunden || config.regelarbeitszeit;
  const normalStunden = Math.min(gesamtStunden, ueberGrenze);
  const ueberStunden  = Math.max(0, gesamtStunden - ueberGrenze);
  const sl = stundenlohnOverride !== undefined ? stundenlohnOverride : config.stundenlohn;
  const normalLohn = normalStunden * sl;
  const ueberLohn  = ueberStunden  * sl * (1 + config.ueberstundenZuschlag / 100);
  let nachtLohn = 0, nachtStunden = 0;
  const nachtZuschlagProzent = Number(config.nachtschichtzulage) || 0;
  if (nachtZuschlagProzent > 0) {
    const ns = parseTime(config.defaultNachtStart || "22:00");
    const ne = parseTime(config.defaultNachtEnde  || "06:00");
    const rohNachtMin = berechneNachtMinuten(start, ende, ns, ne);
    // Die Pause wird zeitlich nicht erfasst (wir wissen nicht, WANN genau sie
    // genommen wurde), daher kann die reine Zeitfenster-Überlappung mehr
    // Nachtminuten ergeben als tatsächlich gearbeitet wurde. Deckeln auf die
    // tatsächliche Arbeitszeit, damit Nachtstunden nie > Gesamtstunden sind.
    nachtStunden = Math.min(Math.max(0, rohNachtMin / 60), gesamtStunden);
    nachtLohn = nachtStunden * sl * (nachtZuschlagProzent / 100);
  }
  return { gesamtMin, gesamtStunden, normalStunden, ueberStunden, normalLohn, ueberLohn, nachtLohn, nachtStunden, gesamtLohn: normalLohn + ueberLohn + nachtLohn };
}

// Berechnet monatliche Überstunden (Monatsmethode):
// Alle Arbeitsstunden des Monats minus Monatssoll (Wochenstunden × Arbeitstage/5)
function berechneMonatlUeberstunden(eintraege, config, year, month, tagestypen, stundenlohn) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const wochenAZ = Number(config.wochenArbeitszeit) || 38.0;
  let arbeitstage = 0, gesamtMin = 0, nachtLohn = 0, nachtStunden = 0, spesen = 0, kleider = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const e = eintraege[dateStr];
    if (!e) continue;
    const typ = (tagestypen||[]).find(t => t.id === (e.typ||"arbeit")) || {zaehlt:true};
    if (!typ.zaehlt) continue;
    const res = berechneTag(e, config, stundenlohn);
    if (!res) continue;
    arbeitstage++;
    gesamtMin += res.gesamtMin;
    nachtLohn += res.nachtLohn || 0;
    nachtStunden += res.nachtStunden || 0;
    if (res.gesamtStunden >= (Number(config.spesenMindestStunden) || 7.6)) spesen += Number(config.spesenBetrag) || 0;
    kleider += Number(config.kleiderreinigungBetrag) || 0;
  }
  const gesamtStunden = gesamtMin / 60;
  const monatsSoll = wochenAZ * (arbeitstage / 5);
  const normalStunden = Math.min(gesamtStunden, monatsSoll);
  const ueberStunden = Math.max(0, gesamtStunden - monatsSoll);
  const normLohn = normalStunden * stundenlohn;
  const mehrLohn = ueberStunden * stundenlohn;
  const ueberZuschlag = ueberStunden * stundenlohn * (Number(config.ueberstundenZuschlag) / 100);
  return { gesamtStunden, normalStunden, ueberStunden, monatsSoll, normLohn, mehrLohn, ueberZuschlag, nachtLohn, nachtStunden, spesen, kleider, arbeitstage, gesamtMin, gesamtLohn: normLohn + mehrLohn + ueberZuschlag + nachtLohn };
}

// Berechnet wöchentliche Überstunden:
// Mehrarbeit = Stunden zwischen Regelarbeitszeit und Wochengrenze (z.B. 38-40h)
// Ueberstunden = Stunden ueber Wochengrenze mit Zuschlag
function berechneWoechentlUeberstunden(eintraege, config, year, month, tagestypen, stundenlohn) {
  const regelAZ = Number(config.regelarbeitszeit) || 7.6;
  const grenzeWoche = Number(config.ueberstundenGrenzeWoche) || 40.0;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let gesamtNormalLohn = 0, gesamtMehrLohn = 0, gesamtUeberLohn = 0, gesamtUeberZuschlag = 0;
  let gesamtNormalStd = 0, gesamtMehrStd = 0, gesamtUeberStd = 0;
  let gesamtMin = 0, nachtLohn = 0, nachtStunden = 0, spesen = 0, kleider = 0, arbeitstage = 0;

  // Alle Wochen die ins Monat fallen ermitteln
  const wochen = new Map();
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const dow = date.getDay();
    if (dow === 0 || dow === 6) continue;
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    // Montag dieser Woche
    const montag = new Date(date);
    montag.setDate(date.getDate() - ((dow + 6) % 7));
    const wKey = lokalesDatum(montag);
    if (!wochen.has(wKey)) wochen.set(wKey, []);
    wochen.get(wKey).push(dateStr);
  }

  wochen.forEach((tage) => {
    let wocheMin = 0, wocheArbeitstage = 0, wocheNachtLohn = 0, wocheNachtStunden = 0, wocheEchteAT = 0;
    const tagesDaten = [];
    tage.forEach(dateStr => {
      const e = eintraege[dateStr];
      if (!e) return;
      const typ = (tagestypen||[]).find(t => t.id === (e.typ||"arbeit")) || {zaehlt:true};
      if (typ.zaehlt) {
        const res = berechneTag(e, config, stundenlohn);
        if (!res) return;
        wocheMin += res.gesamtMin;
        wocheArbeitstage++;
        wocheEchteAT++;
        wocheNachtLohn += res.nachtLohn || 0;
        wocheNachtStunden += res.nachtStunden || 0;
        gesamtMin += res.gesamtMin;
        arbeitstage++;
        tagesDaten.push({dateStr, res});
        if (res.gesamtStunden >= (Number(config.spesenMindestStunden)||7.6)) spesen += Number(config.spesenBetrag)||0;
        kleider += Number(config.kleiderreinigungBetrag)||0;
      } else if ((tagestypen||[]).find(t=>t.id===(e.typ||"arbeit"))?.bezahlt) {
        // Urlaub/Feiertag: Regelstunden zur Woche für Grenzberechnung
        wocheMin += regelAZ * 60;
        wocheArbeitstage++;
      }
    });

    const wocheStd = wocheMin / 60;
    const sollWoche = wocheArbeitstage * regelAZ;
    const grenzeWocheAkt = wocheArbeitstage * (grenzeWoche / 5);

    // Normalstunden = nur echte Arbeitstage × Regelarbeitszeit (wie Abrechnung)
    const normalStd = wocheEchteAT * regelAZ;
    const mehrStd   = Math.max(0, Math.min(wocheStd, grenzeWocheAkt) - sollWoche);
    const ueberStd  = Math.max(0, wocheStd - grenzeWocheAkt);

    gesamtNormalStd += normalStd;
    gesamtMehrStd   += mehrStd;
    gesamtUeberStd  += ueberStd;
    gesamtNormalLohn    += normalStd * stundenlohn;
    gesamtMehrLohn      += mehrStd   * stundenlohn;
    gesamtUeberLohn     += ueberStd  * stundenlohn;
    gesamtUeberZuschlag += ueberStd  * stundenlohn * (Number(config.ueberstundenZuschlag) / 100);
    nachtLohn += wocheNachtLohn;
    nachtStunden += wocheNachtStunden;
  });

  const gesamtLohn = gesamtNormalLohn + gesamtMehrLohn + gesamtUeberLohn + gesamtUeberZuschlag + nachtLohn;
  return {
    gesamtStunden: gesamtMin/60, gesamtMin,
    normalStunden: gesamtNormalStd, mehrStunden: gesamtMehrStd, ueberStunden: gesamtUeberStd,
    normLohn: gesamtNormalLohn, mehrLohn: gesamtMehrLohn,
    ueberLohn: gesamtUeberLohn, ueberZuschlag: gesamtUeberZuschlag,
    nachtLohn, nachtStunden, spesen, kleider, arbeitstage, gesamtLohn
  };
}

// Berechnet Mehrarbeit (ohne Zuschlag) und Überstunden (mit Zuschlag) für EINE
// einzelne Woche (Mo–So, ab wochenStartDate) – genutzt in der Wochenübersicht,
// wenn die wöchentliche Überstunden-Methode aktiv ist.
// bisTagIndex (optional, 0=Mo ... 6=So): begrenzt die Berechnung auf die Tage
// Montag bis einschließlich diesem Index – wird genutzt, um im Erfassen-Tab
// den kumulierten Wochenstand bis zu einem bestimmten Tag zu ermitteln.
function berechneEinzelwoche(eintraege, config, wochenStartDate, tagestypen, stundenlohn, bisTagIndex) {
  const regelAZ = Number(config.regelarbeitszeit) || 7.6;
  const grenzeWoche = Number(config.ueberstundenGrenzeWoche) || 40.0;
  const maxIndex = (bisTagIndex===undefined) ? 6 : bisTagIndex;
  let wocheMin = 0, wocheArbeitstage = 0, wocheEchteAT = 0, nachtLohn = 0, spesen = 0, kleider = 0;
  for (let i = 0; i <= maxIndex; i++) {
    const d = new Date(wochenStartDate);
    d.setDate(d.getDate() + i);
    const dow = d.getDay();
    if (dow === 0 || dow === 6) continue; // Grenzberechnung nur Mo–Fr
    const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const e = eintraege[dateStr];
    if (!e) continue;
    const typ = (tagestypen||[]).find(t => t.id === (e.typ||"arbeit")) || {zaehlt:true};
    if (typ.zaehlt) {
      const res = berechneTag(e, config, stundenlohn);
      if (!res) continue;
      wocheMin += res.gesamtMin;
      wocheArbeitstage++;
      wocheEchteAT++;
      nachtLohn += res.nachtLohn || 0;
      if (res.gesamtStunden >= (Number(config.spesenMindestStunden)||7.6)) spesen += Number(config.spesenBetrag)||0;
      kleider += Number(config.kleiderreinigungBetrag)||0;
    } else if (typ.bezahlt) {
      wocheMin += regelAZ * 60;
      wocheArbeitstage++;
    }
  }
  const wocheStd = wocheMin / 60;
  const sollWoche = wocheArbeitstage * regelAZ;
  const grenzeWocheAkt = wocheArbeitstage * (grenzeWoche / 5);
  const normalStd = wocheEchteAT * regelAZ;
  const mehrStd    = Math.max(0, Math.min(wocheStd, grenzeWocheAkt) - sollWoche);
  const ueberStd   = Math.max(0, wocheStd - grenzeWocheAkt);
  const normLohn       = normalStd * stundenlohn;
  const mehrLohn        = mehrStd   * stundenlohn;
  const ueberLohn       = ueberStd  * stundenlohn;
  const ueberZuschlag   = ueberStd  * stundenlohn * (Number(config.ueberstundenZuschlag) / 100);
  const gesamtLohn = normLohn + mehrLohn + ueberLohn + ueberZuschlag + nachtLohn;
  return {
    gesamtStunden: wocheMin/60, gesamtMin: wocheMin,
    normalStunden: normalStd, mehrStunden: mehrStd, ueberStunden: ueberStd,
    normLohn, mehrLohn, ueberLohn, ueberZuschlag,
    nachtLohn, spesen, kleider, arbeitstage: wocheArbeitstage, gesamtLohn
  };
}

function berechneEffektivlohn(eintraege, config, bisMonat, bisJahr) {
  // Effektivlohn deaktiviert → normaler Stundenlohn
  if (config.effektivlohnAktiv === false) return Number(config.stundenlohn) || 0;
  // Manuellen Effektivlohn verwenden wenn eingestellt
  if (Number(config.manuellerEffektivlohn) > 0) return Number(config.manuellerEffektivlohn);
  // § 11 BUrlG: Grundlohn × geleistete Stunden ÷ Sollstunden der letzten 13 Wochen
  const regelAZ = config.regelarbeitszeit || 7.6;
  const refDate = new Date(bisJahr, bisMonat, 1); // 1. des aktuellen Monats
  const startDate = new Date(refDate);
  startDate.setDate(startDate.getDate() - 91); // 13 Wochen = 91 Tage zurück
  let gesamtStundenLohn = 0; // Grundlohn × alle geleisteten Stunden
  let sollStunden = 0;       // Arbeitstage × Regelarbeitszeit
  const cur = new Date(startDate);
  while (cur < refDate) {
    const dow = cur.getDay();
    const dateStr = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}-${String(cur.getDate()).padStart(2,"0")}`;
    if (dow !== 0 && dow !== 6) { // Mo–Fr
      const e = eintraege[dateStr];
      const slM = getStundenlohnFuerMonat(config, cur.getFullYear(), cur.getMonth());
      if (e && (e.typ === "arbeit" || e.typ === "homeoffice" || !e.typ) && e.start && e.ende) {
        const [sh, sm] = e.start.split(":").map(Number);
        const [eh, em] = e.ende.split(":").map(Number);
        const startMin = sh*60+sm;
        let endeMin = eh*60+em;
        if (endeMin <= startMin) endeMin += 1440; // Schicht über Mitternacht
        const min_w = endeMin - startMin - Number(e.pause||0);
        const stunden = Math.max(0, min_w / 60);
        gesamtStundenLohn += stunden * slM; // Grundlohn, kein ÜS-Zuschlag
        sollStunden += regelAZ;
      }
    }
    cur.setDate(cur.getDate() + 1);
  }
  if (sollStunden < 1) return Number(config.stundenlohn) || 0;
  return Math.round(gesamtStundenLohn / sollStunden * 100) / 100;
}

const KIRCHENSTEUER_SATZ = {
  BY:0.08,BW:0.08,BE:0.09,BB:0.09,HB:0.09,HH:0.09,HE:0.09,
  MV:0.09,NI:0.09,NW:0.09,RP:0.09,SL:0.09,SN:0.09,ST:0.09,SH:0.09,TH:0.09
};
const BUNDESLAENDER = [
  ["BY","Bayern"],["BW","Baden-Württemberg"],["BE","Berlin"],["BB","Brandenburg"],
  ["HB","Bremen"],["HH","Hamburg"],["HE","Hessen"],["MV","Mecklenburg-Vorpommern"],
  ["NI","Niedersachsen"],["NW","Nordrhein-Westfalen"],["RP","Rheinland-Pfalz"],
  ["SL","Saarland"],["SN","Sachsen"],["ST","Sachsen-Anhalt"],["SH","Schleswig-Holstein"],["TH","Thüringen"]
];

function berechneNetto(bruttoMonat, spesenMonat, config, jahresBrutto, jahresSpesen, year, month) {
  const bavM = (year !== undefined && month !== undefined) ? getBavFuerMonat(config, year, month) : (Number(config.bav) || 0);
  const bruttoAbzuegeM = (config.zusatzAbzuege||[]).filter(a=>a.typ==="brutto").reduce((s,a)=>s+Number(a.betrag||0),0);
  // Brutto-Zusatzbezüge (z.B. Sachbezug BKV, VwL AG) erhöhen das Steuerbrutto.
  // Standardmäßig NICHT bar ausgezahlt (Sachbezug) – außer a.auszahlung===true
  // (z.B. eine versteuerte Zulage/Prämie, die trotzdem ausgezahlt wird).
  const sachbezugBrutto = (config.zusatzBezuege||[]).filter(a=>(a.typ||"brutto")==="brutto").reduce((s,a)=>s+Number(a.betrag||0),0);
  const bruttoBezuegeAusgezahlt = (config.zusatzBezuege||[]).filter(a=>(a.typ||"brutto")==="brutto" && a.auszahlung===true).reduce((s,a)=>s+Number(a.betrag||0),0);
  const steuerBrutto = Math.max(0, bruttoMonat - bavM - bruttoAbzuegeM + sachbezugBrutto);
  const { steuerklasse, kirchensteuer, bundesland, kinderfreibetrage } = config;
  const sk = Number(steuerklasse);
  const kinder = Number(kinderfreibetrage) || 0;

  // SV auf Steuerbrutto (nach bAV-Abzug) - wie in der Lohnabrechnung
  // BBG 2026 (einheitlich Ost/West): RV/AV 101.400€/Jahr, KV/PV 69.750€/Jahr
  const BBG_RV = 101400/12, BBG_KV = 69750/12;
  const rvBasis = Math.min(steuerBrutto, BBG_RV);
  const kvBasis = Math.min(steuerBrutto, BBG_KV);
  const kvZusatzSatz = (config.kvZusatzAN !== undefined ? Number(config.kvZusatzAN) : (Number(config.kvZusatz)||2.98)/2)/100;
  // KV-Basissatz AN: Standard 7.3%, aber per Tarifvertrag kann AG mehr übernehmen
  const kvBasissatz = (Number(config.kvBasissatz)||7.3)/100;
  const rv    = Math.round(rvBasis * 0.093  * 100)/100;
  const av    = Math.round(rvBasis * 0.013  * 100)/100;
  const kv    = Math.round(kvBasis * kvBasissatz * 100)/100;
  const zvBei = Math.round(kvBasis * kvZusatzSatz * 100)/100;
  // PV 2026: Satz hängt von EIGENEN Kindern ab (nicht Kinderfreibeträge!)
  // Basis-AN-Anteil 1,80% + 0,60% Kinderlosenzuschlag (ab 23J.) | ab 2. Kind (u25J.)
  // je -0,25%/Kind, max. -1,00% bei 5+ Kindern. (§55 SGB XI / PUEG)
  // Kinderlos: 2.40% | 1 Kind: 1.80% | 2K: 1.55% | 3K: 1.30% | 4K: 1.05% | 5+K: 0.80%
  const eigenKinder = Number(config.eigenKinder) || 0;
  // Sachsen: AN zahlt 0,5 Prozentpunkte mehr PV, AG entsprechend weniger
  // (Sachsen hat einen gesetzlichen Feiertag weniger als die übrigen Bundesländer).
  const pvSaetze2026 = bundesland === "SN"
    ? [0.0290, 0.0230, 0.0205, 0.0180, 0.0155, 0.0130]
    : [0.0240, 0.0180, 0.0155, 0.0130, 0.0105, 0.0080];
  const pvIdx = Math.min(eigenKinder, 5);
  const pvSatz = pvSaetze2026[pvIdx];
  const pv = Math.round(kvBasis * pvSatz * 100)/100;
  const svGesamt = rv+av+kv+pv;
  const svGesamtMitZV = svGesamt+zvBei;

  // Lohnsteuer auf Steuerbrutto × 12 (wie eine echte monatliche Gehaltsabrechnung:
  // die Lohnsteuer schwankt mit dem tatsächlichen Verdienst dieses Monats).
  // "Erwartetes Jahresbrutto" wird hier bewusst NICHT mehr verwendet, da es die
  // Lohnsteuer sonst jeden Monat auf denselben Wert einfrieren würde, unabhängig
  // vom tatsächlichen Monatsverdienst — das entspricht keiner echten Abrechnung.
  const jbSteuer = steuerBrutto * 12;

  // Pauschbeträge & Vorsorgepauschale nach §39b Abs. 2 Satz 5 Nr. 3 EStG (Stand 2026,
  // BMF-Schreiben vom 14.08.2025). Fehlten hier bisher komplett → zvE war zu hoch angesetzt.
  const AN_PAUSCHBETRAG = 1230;           // Werbungskosten-Pauschbetrag
  const SONDERAUSGABEN_PAUSCHBETRAG = 36; // Sonderausgaben-Pauschbetrag (Nr. 1)
  // a) RV-Teilbetrag: 100% des AN-Anteils (seit 2023), gedeckelt auf BBG_RV
  const vpRV = Math.min(steuerBrutto, BBG_RV) * 0.093 * 12;
  // b) KV-Teilbetrag: ERMÄSSIGTER Satz 7,0% (§243 SGB V, ohne Krankengeldanspruch-Anteil)
  //    + tatsächlicher Zusatzbeitragssatz dieser Krankenkasse, gedeckelt auf BBG_KV
  const vpKV = Math.min(steuerBrutto, BBG_KV) * (0.070 + kvZusatzSatz) * 12;
  // c) PV-Teilbetrag: wie tatsächlicher PV-Satz (gleiche Tabelle), gedeckelt auf BBG_KV
  const vpPV = Math.min(steuerBrutto, BBG_KV) * pvSatz * 12;
  // e) AV-Teilbetrag (neu ab 2026): nur soweit b+c+d zusammen 1.900€/Jahr NICHT übersteigen
  //    → bei normalen/höheren Einkommen faktisch immer 0, da KV+PV allein meist >1.900€ sind
  const vpAV = (vpKV + vpPV <= 1900) ? Math.min(steuerBrutto, BBG_RV) * 0.013 * 12 : 0;
  const vorsorgepauschale = Math.ceil(vpRV + vpKV + vpPV + vpAV); // auf volle € aufrunden

  // zvE = volles zu versteuerndes Einkommen NACH Pauschbeträgen/Vorsorgepauschale,
  // aber VOR Grundfreibetrag-Abzug — der Grundfreibetrag ist bereits die obere
  // Grenze von Zone 1 der Tarifformel unten, nicht separat davon abzuziehen.
  let zvE = jbSteuer - AN_PAUSCHBETRAG - SONDERAUSGABEN_PAUSCHBETRAG - vorsorgepauschale;
  zvE = Math.max(0, Math.floor(zvE / 36) * 36);

  // Tarifformel § 32a EStG 2026 (Eckwerte 12.348 / 17.799 / 69.878 / 277.825 €;
  // x = volles zvE, y/z jeweils der die Zonengrenze übersteigende Teil ÷ 10.000)
  const tarif2026 = x => {
    if (x <= 12348) return 0;
    if (x <= 17799) { const y=(x-12348)/10000; return Math.floor((914.51*y+1400)*y); }
    if (x <= 69878) { const z=(x-17799)/10000; return Math.floor((173.10*z+2397)*z+1034.87); }
    if (x <= 277825) return Math.floor(0.42*x-11135.63);
    return Math.floor(0.45*x-19470.38);
  };

  let stJahr;
  if (sk===3) {
    // Splittingverfahren §32a Abs.5: Tarif auf die HALBE Bemessungsgrundlage anwenden,
    // Ergebnis verdoppeln — NICHT die fertige Steuer halbieren (das wäre falsch, da
    // der Tarif progressiv/nicht-linear ist).
    stJahr = 2 * tarif2026(zvE/2);
  } else if (sk===5) {
    // Grobe Näherung (echtes SK5 nutzt eine Vergleichsrechnung/Faktor, kein reines ×2)
    stJahr = tarif2026(zvE) * 2;
  } else {
    stJahr = tarif2026(zvE);
  }

  const lohnsteuerMonat = Math.max(0, stJahr/12);
  const soli = stJahr > 20350 ? Math.round(lohnsteuerMonat*0.055*100)/100 : 0;
  const ks   = Math.round(lohnsteuerMonat*(kirchensteuer?(KIRCHENSTEUER_SATZ[bundesland]||0.09):0)*100)/100;

  // Netto-Abzüge: AVmG aus Verlauf, alle anderen aus zusatzAbzuege
  const avmgBetrag = (year !== undefined && month !== undefined) ? getAvmgFuerMonat(config, year, month) : ((config.zusatzAbzuege||[]).find(a=>a._preset==="avmg") ? Number((config.zusatzAbzuege||[]).find(a=>a._preset==="avmg").betrag||0) : 0);
  const zusatzGesamt = (config.zusatzAbzuege||[]).filter(a=>(a.typ||"netto")==="netto").reduce((s,a)=>{
    if (a._preset==="avmg") return s + avmgBetrag;
    return s + Number(a.betrag||0);
  }, 0);
  const vlM = Number(config.vl) || 0;
  const zusatzBezuegeNetto = (config.zusatzBezuege||[]).filter(a=>(a.typ||"brutto")==="netto").reduce((s,a)=>s+Number(a.betrag||0),0);
  // Brutto-Zusatzabzüge (z.B. Entgeltumwandlung/AVmG) mindern die Steuer-/SV-Basis
  // UND werden real vom Gehalt einbehalten → gehören ebenfalls in die Abzüge,
  // sonst würde die App sie "gratis" mit auszahlen, obwohl das Geld nie ankommt.
  const abzuege = svGesamtMitZV+lohnsteuerMonat+soli+ks+zusatzGesamt+vlM+bruttoAbzuegeM;
  const spesenM = spesenMonat || 0;
  const r = v => Math.round(v*100)/100;
  // Netto-Auszahlung: Arbeitslohn-Brutto - Abzüge (inkl. Entgeltumwandlung) + Spesen
  // + Netto-Bezüge + versteuerte Brutto-Bezüge, die trotzdem ausgezahlt werden
  // (z.B. eine Zulage). Reine Sachbezüge (auszahlung !== true) bleiben außen vor.
  const nettoAuszahlung = r(bruttoMonat - abzuege + spesenM + zusatzBezuegeNetto + bruttoBezuegeAusgezahlt);

  return {
    brutto: bruttoMonat, steuerBrutto: r(steuerBrutto), sachbezugBrutto: r(sachbezugBrutto),
    bruttoAbzuegeM: r(bruttoAbzuegeM), bruttoBezuegeAusgezahlt: r(bruttoBezuegeAusgezahlt),
    rv:r(rv), av:r(av), kv:r(kv), zvBei:r(zvBei), pv:r(pv),
    svGesamt:r(svGesamt), svGesamtMitZV:r(svGesamtMitZV),
    lohnsteuer:r(lohnsteuerMonat), soli:r(soli), kirchensteuer:r(ks),
    zusatzAbzuege:config.zusatzAbzuege||[], zusatzGesamt:r(zusatzGesamt),
    zusatzBezuegeNetto:r(zusatzBezuegeNetto),
    spesen:r(spesenM),
    abzuege:r(abzuege), netto:nettoAuszahlung
  };
}

// Eigener Zeit-Picker (statt <input type="time">), damit auf allen Geräten
// (z.B. Samsung One UI) das gleiche, verlässliche Verhalten gilt - keine
// abgeschnittenen OK/Abbrechen-Buttons im nativen System-Dialog mehr.
function TimeSelect({ value, onChange, style, minuteStep }) {
  const step = minuteStep || 1;
  const [hh, mm] = (value || "00:00").split(":");
  const hourVal = hh || "00";
  const minuteVal = mm || "00";
  const hours = Array.from({length:24}, (_,i)=>String(i).padStart(2,"0"));
  const minutes = [];
  for (let m=0; m<60; m+=step) minutes.push(String(m).padStart(2,"0"));
  if (!minutes.includes(minuteVal)) minutes.push(minuteVal);
  minutes.sort();
  const selectStyle = {
    background:"transparent", border:"none", color:"var(--eingabe-textfarbe, #ffffff)",
    fontSize:style?.fontSize||16, fontFamily:"inherit", fontWeight:600, textAlign:"center",
    outline:"none", cursor:"pointer", padding:"0 2px",
    WebkitAppearance:"none", MozAppearance:"none", appearance:"none",
  };
  return (
    <div style={{...inp, ...style, display:"flex", alignItems:"center", justifyContent:"center", gap:2, padding:"10px 14px"}}>
      <select value={hourVal} onChange={e=>onChange(`${e.target.value}:${minuteVal}`)} style={selectStyle}>
        {hours.map(h=>(<option key={h} value={h} style={{background:"#1a1a2e",color:"#fff"}}>{h}</option>))}
      </select>
      <span style={{color:"#9ca3af",fontWeight:700}}>:</span>
      <select value={minuteVal} onChange={e=>onChange(`${hourVal}:${e.target.value}`)} style={selectStyle}>
        {minutes.map(m=>(<option key={m} value={m} style={{background:"#1a1a2e",color:"#fff"}}>{m}</option>))}
      </select>
      <span style={{color:"var(--label-textfarbe, #6b7280)",fontSize:12,marginLeft:6}}>Uhr</span>
    </div>
  );
}

function App() {
  const [view, setView] = useState(() => {
    try { return JSON.parse(localStorage.getItem(CONFIG_KEY))?.appStartView || "erfassen"; } catch { return "erfassen"; }
  });
  const [config, setConfig] = useState(() => {
    try {
      const loaded = JSON.parse(localStorage.getItem(CONFIG_KEY));
      if (!loaded) return defaultConfig;
      // Neue Standard-Tagestypen (App-Updates) automatisch ergänzen, ohne bestehende zu verändern
      const vorhandeneIds = new Set((loaded.tagestypen||[]).map(x=>x.id));
      const fehlende = DEFAULT_TAGESTYPEN.filter(x=>!vorhandeneIds.has(x.id));
      if (fehlende.length > 0) {
        loaded.tagestypen = [...(loaded.tagestypen||[]), ...fehlende];
      }
      return loaded;
    } catch { return defaultConfig; }
  });
  const [eintraege, setEintraege] = useState(() => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}; } catch { return {}; }});

  const today = new Date();
  const [selectedDate, setSelectedDate]   = useState(lokalesDatum(today));
  const [selectedMonth, setSelectedMonth] = useState({year:today.getFullYear(),month:today.getMonth()});
  const [selectedWeek, setSelectedWeek] = useState(()=>{ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return lokalesDatum(d); });
  const [selectedYear, setSelectedYear] = useState(today.getFullYear());
  const [subView, setSubView] = useState("arbeit");
  const [confirmDialog, setConfirmDialog] = useState(null); // {message, onConfirm}

  const lang = config.appSprache || "de";
  const T = TRANSLATIONS[lang] || TRANSLATIONS.de;
  const t = key => T[key] || TRANSLATIONS.de[key] || key;
  // Wie t(), ersetzt aber Platzhalter wie {n}, {a}, {b} im übersetzten Text
  const tf = (key, vars) => {
    let str = t(key);
    Object.keys(vars||{}).forEach(k => { str = str.split(`{${k}}`).join(vars[k]); });
    return str;
  };
  const WEEKDAYS = T.weekdays;
  const MONTHS = T.months;
  // Translate default day type labels; custom types keep their user-defined label
  const tTypLabel = typ => {
    const key = `dt_${typ.id}`;
    return T[key] ? T[key] : typ.label;
  };

  const tagestypen = config.tagestypen || DEFAULT_TAGESTYPEN;
  const eintrag = eintraege[selectedDate] || {start:config.defaultStart||"",ende:config.defaultEnde||"",pause:config.defaultPause||"30",notiz:"",kilometer:"",kraftstoff:"",kunden:"",typ:"arbeit"};
  const aktuellerTyp = tagestypen.find(t => t.id === (eintrag.typ||"arbeit")) || tagestypen[0];

  useEffect(()=>{ localStorage.setItem(STORAGE_KEY, JSON.stringify(eintraege)); },[eintraege]);
  useEffect(()=>{ localStorage.setItem(CONFIG_KEY,  JSON.stringify(config)); },[config]);

  function updateEintrag(field, value) {
    setEintraege(prev => ({...prev, [selectedDate]:{...eintrag,[field]:value}}));
  }

  const [tagesJahr, tagesMonat] = selectedDate.split("-").map(Number);
  const tagesSlohn = getStundenlohnFuerMonat(config, tagesJahr, tagesMonat - 1);
  const tagesErgebnis = aktuellerTyp.zaehlt ? berechneTag(eintrag, config, tagesSlohn) : null;

  const {year,month} = selectedMonth;
  const daysInMonth = new Date(year,month+1,0).getDate();
  let monatsGesamtMin=0,monatsNormal=0,monatsUeber=0,monatsUeberZuschlag=0,monatsLohn=0,monatsKm=0,monatsKraftstoff=0,monatsKunden=0,monatsAbholer=0,monatsSpesen=0,monatsKleider=0,monatsUrlaub=0,monatsFeiertage=0,monatsKranktage=0,monatsKindkranktage=0,monatsUrlaubMin=0,monatsFeiertageMin=0,monatsKranktageMin=0,monatsKindkranktageMin=0,monatsNachtStunden=0,monatsNachtLohn=0,monatsTrinkgeld=0,monatsPatienten=0,monatsGefahren=0,monatsGeldeinnahmen=0;

  // Monatliche oder wöchentliche Überstunden-Methode
  const slM = getStundenlohnFuerMonat(config, year, month);
  const ueberstundenMethode = config.ueberstundenMethode || (config.ueberstundenMonatlich ? "monatlich" : "taeglich");
  if (ueberstundenMethode === "monatlich") {
    const mRes = berechneMonatlUeberstunden(eintraege, config, year, month, tagestypen, slM);
    monatsGesamtMin = mRes.gesamtMin;
    monatsNormal    = mRes.normalStunden * 60;
    monatsUeber     = mRes.ueberStunden * 60;
    monatsUeberZuschlag = monatsUeber; // hier bekommen alle Überstunden den Zuschlag
    monatsLohn      = mRes.gesamtLohn;
    monatsSpesen    = mRes.spesen;
    monatsKleider   = mRes.kleider;
    monatsNachtLohn = mRes.nachtLohn;
    monatsNachtStunden = mRes.nachtStunden;
  } else if (ueberstundenMethode === "woechentlich") {
    const wRes = berechneWoechentlUeberstunden(eintraege, config, year, month, tagestypen, slM);
    monatsGesamtMin = wRes.gesamtMin;
    monatsNormal    = wRes.normalStunden * 60;
    monatsUeber     = (wRes.mehrStunden + wRes.ueberStunden) * 60; // Mehrarbeit (ohne Zuschlag) + Überstunden (mit Zuschlag)
    monatsUeberZuschlag = wRes.ueberStunden * 60; // nur dieser Teil bekommt den Zuschlag
    monatsLohn      = wRes.gesamtLohn;
    monatsSpesen    = wRes.spesen;
    monatsKleider   = wRes.kleider;
    monatsNachtLohn = wRes.nachtLohn;
    monatsNachtStunden = wRes.nachtStunden;
  }
  const monatsTage = [];
  const effektivlohn = berechneEffektivlohn(eintraege, config, month, year);
  // Zusatzbezüge zum Brutto addieren
  const zusatzBezuegeBrutto = (config.zusatzBezuege||[]).filter(a=>(a.typ||"brutto")==="brutto").reduce((s,a)=>s+Number(a.betrag||0),0);
  // bAV: AG-Anteil erhöht Gesamtbrutto (§3 Nr.63 EStG), wird in berechneNetto steuer-/SV-frei gestellt
  const bavMonat = getBavFuerMonat(config, year, month);
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const eTyp = eintraege[dateStr]?.typ||"arbeit";
    const eTypObj = (config.tagestypen||DEFAULT_TAGESTYPEN).find(t=>t.id===eTyp)||DEFAULT_TAGESTYPEN[0];
    const slTag = getStundenlohnFuerMonat(config, year, month);
    const e=eintraege[dateStr], res=(e && eTypObj.zaehlt)?berechneTag(e,config,slTag):null;
    if(ueberstundenMethode==="taeglich") {
      if(res && eTypObj.zaehlt){monatsGesamtMin+=res.gesamtMin;monatsNormal+=res.normalStunden;monatsUeber+=res.ueberStunden;monatsUeberZuschlag+=res.ueberStunden;monatsLohn+=res.gesamtLohn;monatsNachtStunden+=res.nachtStunden||0;monatsNachtLohn+=res.nachtLohn||0;}
      if(e && !eTypObj.zaehlt) {
        const typ = (config.tagestypen||DEFAULT_TAGESTYPEN).find(t=>t.id===(e.typ||"arbeit"));
        if(typ && typ.bezahlt) {
          const stunden = typ.bezahltStunden || config.regelarbeitszeit;
          monatsLohn += stunden * effektivlohn;
        }
      }
      if(res && res.gesamtStunden >= (config.spesenMindestStunden||8)) monatsSpesen += Number(config.spesenBetrag)||0;
      if(res) monatsKleider += Number(config.kleiderreinigungBetrag)||0;
    }
    // Urlaub/Feiertag Zähler immer (unabhängig von Methode)
    if(e && !eTypObj.zaehlt) {
      const typ = (config.tagestypen||DEFAULT_TAGESTYPEN).find(t=>t.id===(e.typ||"arbeit"));
      if(typ) {
        const stunden = typ.bezahltStunden || config.regelarbeitszeit;
        // Kindkrank immer zählen (auch wenn nicht bezahlt)
        if(typ.id==="kindkrank") { monatsKindkranktage++; monatsKindkranktageMin+=stunden*60; }
        if(typ.bezahlt) {
          if(typ.id==="urlaub") { monatsUrlaub++; monatsUrlaubMin+=stunden*60; }
          if(typ.id==="feiertag") { monatsFeiertage++; monatsFeiertageMin+=stunden*60; }
          if(typ.id==="krank") { monatsKranktage++; monatsKranktageMin+=stunden*60; }
          // Lohn zum Effektivlohn addieren (bei nicht-täglicher Methode)
          if(ueberstundenMethode !== "taeglich") monatsLohn += stunden * effektivlohn;
        }
      }
    }
    // Km, Kunden, Abholer, Kraftstoff – immer zählen unabhängig von Methode
    if(e&&e.kilometer)  monatsKm         += Number(e.kilometer)||0;
    if(e&&e.kraftstoff) monatsKraftstoff += Number(e.kraftstoff)||0;
    if(e&&e.kunden)     monatsKunden     += Number(e.kunden)||0;
    if(e&&e.abholer)    monatsAbholer    += Number(e.abholer)||0;
    if(e&&e.trinkgeld)  monatsTrinkgeld     += Number(e.trinkgeld)||0;
    if(e&&e.patienten)  monatsPatienten     += Number(e.patienten)||0;
    if(e&&e.nachname)   monatsGeldeinnahmen += Number(e.nachname)||0;
    if(e&&e.startkilometer&&e.endkilometer) monatsGefahren += Math.max(0,Number(e.endkilometer)-Number(e.startkilometer));
    monatsTage.push({d,dateStr,e,res});
  }
  // Einmalzahlungen dieses Monats
  const einmaligKey = `${year}-${String(month+1).padStart(2,"0")}`;
  const einmaligEintraege = eintraege[`__einmalig__${einmaligKey}`] || [];
  const einmaligBrutto = einmaligEintraege.filter(e=>e.typ==="brutto"&&Number(e.betrag)>0).reduce((s,e)=>s+Number(e.betrag),0);
  const einmaligAbzug  = einmaligEintraege.filter(e=>e.typ==="abzug" &&Number(e.betrag)>0).reduce((s,e)=>s+Number(e.betrag),0);
  const einmaligNetto  = einmaligEintraege.filter(e=>e.typ==="netto" &&Number(e.betrag)>0).reduce((s,e)=>s+Number(e.betrag),0);
  // Jahresbrutto für Lohnsteuerberechnung (Monatsbrutto x 12)
  const jahresBrutto = Number(config.erwartetesJahresbrutto) > 0 ? Number(config.erwartetesJahresbrutto) : monatsLohn * 12;
  const jahresSpesen = monatsSpesen * 12;
  const nettoMonat = berechneNetto(monatsLohn + einmaligBrutto, monatsSpesen + monatsKleider, config, jahresBrutto, jahresSpesen, year, month);

  return (
    <>
    <div style={{minHeight:"100vh",background:config.appHintergrund||"linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%)",fontFamily:"'DM Mono','Courier New',monospace",color:"#e8e0f0",paddingBottom:90,"--eingabe-textfarbe":config.appEingabeTextfarbe||"#ffffff","--label-textfarbe":config.appLabelTextfarbe||"#6b7280",zoom:config.appZoom||1}}>

      {/* Header */}
      <div style={{padding:"36px 20px 16px",borderBottom:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.03)"}}>
        <div style={{fontSize:11,letterSpacing:4,color:"#a78bfa",textTransform:"uppercase",marginBottom:4}}>{t("zeiterfassung")}</div>
        <div style={{fontSize:26,fontWeight:700,letterSpacing:-0.5,color:"#fff"}}>{config.appName||"WorkTracker"}</div>
      </div>

      <div style={{padding:"20px 16px",maxWidth:480,margin:"0 auto"}}>

        {/* ── ERFASSEN ── */}
        {view==="erfassen" && (
          <div>
            <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)}
              style={{...inp,fontSize:16,marginBottom:20,width:"100%"}} />

            <div style={{marginBottom:16,display:"flex",alignItems:"center",gap:10}}>
              <span style={{background:"rgba(167,139,250,0.18)",color:"#a78bfa",borderRadius:8,padding:"4px 12px",fontSize:13,fontWeight:600,letterSpacing:1}}>
                {WEEKDAYS[new Date(selectedDate+"T12:00:00").getDay()]}
              </span>
              <span style={{color:"#9ca3af",fontSize:13}}>{selectedDate}</span>
            </div>

            {/* Tagestyp Auswahl */}
            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:"#a78bfa",letterSpacing:2,marginBottom:8,textTransform:"uppercase"}}>{t("tagestyp")}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {tagestypen.filter(t=>t.aktiv!==false).map(typ=>(
                  <button key={typ.id} onClick={()=>updateEintrag("typ",typ.id)}
                    style={{padding:"7px 12px",borderRadius:20,border:"1px solid",cursor:"pointer",fontSize:12,fontWeight:600,transition:"all 0.15s",
                      borderColor:eintrag.typ===typ.id||(!eintrag.typ&&typ.id==="arbeit")?typ.color:"rgba(255,255,255,0.12)",
                      background:eintrag.typ===typ.id||(!eintrag.typ&&typ.id==="arbeit")?`${typ.color}22`:"rgba(255,255,255,0.04)",
                      color:eintrag.typ===typ.id||(!eintrag.typ&&typ.id==="arbeit")?typ.color:"var(--label-textfarbe, #6b7280)"}}>
                    {typ.icon} {tTypLabel(typ)}
                  </button>
                ))}
              </div>
            </div>

            {/* Zeitfelder nur wenn Typ "zaehlt" */}
            {aktuellerTyp.zaehlt && (<>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              {[["start","beginn"],["ende","ende"]].map(([field,labelKey])=>(
                <div key={field}>
                  <div style={{fontSize:11,color:"#a78bfa",letterSpacing:2,marginBottom:6,textTransform:"uppercase"}}>{t(labelKey)}</div>
                  <TimeSelect value={eintrag[field]||"00:00"} onChange={v=>updateEintrag(field,v)}
                    style={{fontSize:18}} minuteStep={1} />
                </div>
              ))}
            </div>

            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,color:"#a78bfa",letterSpacing:2,marginBottom:6,textTransform:"uppercase"}}>{t("pause_min")}</div>
              <input type="number" min="0" value={eintrag.pause} onChange={e=>updateEintrag("pause",e.target.value)}
                style={{...inp,width:"100%"}} />
            </div>

            {(config.erfassenFelder?.tour !== false) && (
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,color:"#a78bfa",letterSpacing:2,marginBottom:6,textTransform:"uppercase"}}>{t("tour")}</div>
              <input type="text" value={eintrag.tour||""} placeholder={t("tour_placeholder")}
                onChange={e=>updateEintrag("tour",e.target.value)} style={{...inp,width:"100%"}} />
            </div>
            )}

            {(config.erfassenFelder?.kilometer !== false) && (
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,color:"#a78bfa",letterSpacing:2,marginBottom:6,textTransform:"uppercase"}}>{t("km")}</div>
              <input type="number" min="0" step="0.1" value={eintrag.kilometer||""} placeholder="0"
                onChange={e=>updateEintrag("kilometer",e.target.value)} style={{...inp,width:"100%"}} />

            {(config.erfassenFelder?.kraftstoff !== false || config.erfassenFelder?.kunden !== false || config.erfassenFelder?.abholer !== false) && (
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              {(config.erfassenFelder?.kraftstoff !== false) && (

                <input type="text" inputMode="decimal" min="0" value={eintrag.kraftstoff||""} placeholder="0.00"
                  onChange={e=>updateEintrag("kraftstoff",e.target.value.replace(",","."))} style={{...inp,width:"100%"}} />

              {(config.erfassenFelder?.kunden !== false) && (

              </div>
              )}
              {(config.erfassenFelder?.abholer !== false) && (
              <div>
                <div style={{fontSize:11,color:"#a78bfa",letterSpacing:2,marginBottom:6,textTransform:"uppercase"}}>{t("abholer")}</div>
                <input type="number" min="0" value={eintrag.abholer||""} placeholder="0"

              {config.erfassenFelder?.endkilometer && (

                <input type="number" min="0" step="1" value={eintrag.endkilometer||""} placeholder="0"
                  onChange={e=>updateEintrag("endkilometer",e.target.value)} style={{...inp,width:"100%"}} />

            {config.erfassenFelder?.nachname && (
